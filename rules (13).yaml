    - authoringMethod: code
      baseRuleId: "51523"
      code: "\r\n\r\nIF message.payment.type = 'ATM WITHDRAWAL' OR message.payment.type = 'MOBILE WALLETS' OR message.payment.type = 'ECOM' OR message.payment.type = 'POS' THEN DO;\r\n    IF not missing(message.creditcard.number) and not missing(profile.creditcard.ALL_TRX_DT_MIN[1]) then do;\r\n        dcl int tran_cnt;\r\n        tran_cnt=0;\r\n        do i = 1 to 5;\r\n            if lists.threshold.lookup('time_period_5') then do;\r\n                if not missing(profile.creditcard.ALL_TRX_DT_MIN[i]) and (message.payment.createdDt - profile.creditcard.ALL_TRX_DT_MIN[i] < dhms(0,0,listValues.threshold.threshold_value,0)) then do;\r\n                    tran_cnt = tran_cnt + profile.creditcard.ALL_TRX_COUNT_MIN[i] ;\r\n                end;\r\n            end;\r\n        end;\r\n    if lists.threshold.lookup('transaction_count_5') then do;\r\n        if tran_cnt >= listValues.threshold.threshold_value then do;\r\n            if lists.score.lookup('RULE_5') then do;\r\n                profile.customer.RULE_SCORE_5 = listValues.score.score_value;\r\n                profile.customer.BLOCK_CODE = 'CBLK';\r\n                detection.Fire();\r\n            end;\r\n        end;\r\n    end;\r\n    end;\r\nend;\r\n"
      createdBy: sas
      creationTimeStamp: "2026-08-12T06:56:10.878824Z"
