    - authoringMethod: assistant
      baseRuleId: "51571"
      code: |+
        if (message.payment.type IN ('LOGIN')) then do;
          if (message.payment.status IN ('SUCCESS')) then do;
          if ('count(payment.createdDt - customer.LOGIN_FAILED_DT)' IN ('index(cimb_threshold.R02_FAILED_LOGIN_WINDOW_MIN,threshold)','index(cimb_threshold.R02_FAILED_LOGIN_COUNT,threshold)')) then do;
          profile.customer.RULE_SCORE_2=index('cimb_score.R02','score');

        end;

        end;
        if (profile.customer.RULE_SCORE_2 > 0) then do;
          detection.decline();detection.fire();
        end;

        end;

