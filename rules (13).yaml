    - authoringMethod: code
      baseRuleId: "51574"
      code: "if message.payment.type = 'FUND TRANSFER' then do;\r\n    if lists.bidv_accountBlacklist.contains(\r\n        message.creditaccount.bankName,message.creditaccount.number) then do;\r\n\r\n            if lists.bidv_score.lookup('R01') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc='Detect fund transfers to a blacklisted account and decline a potentially fraudulent transaction';\r\n                profile.customer.fired_rule_name='BIDV_R01 Blacklist Beneficiary Account';\r\n                profile.customer.rule_score_1 = listValues.bidv_score.score;\r\n            end;\r\n\r\n        end;\r\n        \r\nend;"
      createdBy: sas
