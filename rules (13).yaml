    - authoringMethod: assistant
      baseRuleId: "51555"
      code: |+
        if (message.payment.type = 'FUND TRANSFER') then do;
          if (~MISSING('lookup (blacklistedBeneficiaryAccount, Account Number)')) then do;
          if (~MISSING(index('blacklistedBeneficiaryAccount.account_number','risk_level'))) then do;
          if ('risk_level' = 'HIGH') then do;
          profile.customer.ACB_SCORE_3=index('acb_score.R04_HIGH','score');
        detection.decline();detection.fire();
        end;
        else if ('risk_level' = 'MEDIUM') then do;
          profile.customer.ACB_SCORE_3=index('acb_score.R04_MEDIUM','score');
        detection.decline();detection.fire();
        end;
        else if ('risk_level' = 'LOW') then do;
          profile.customer.ACB_SCORE_3=index('acb_score.R04_LOW','score');
        detection.decline();detection.fire();
        end;

        end;

        end;
        else if (~MISSING('lookup (blacklistedBeneficiaryName, Beneficiary Name)')) then do;
          if (~MISSING(index('blacklistedBeneficiaryName.beneficiary_name','risk_level'))) then do;
          if ('risk_level' = 'HIGH') then do;
          profile.customer.ACB_SCORE_3=index('acb_score.R04_HIGH','score');
        detection.decline();detection.fire();
        end;
        else if ('risk_level' = 'MEDIUM') then do;
          profile.customer.ACB_SCORE_3=index('acb_score.R04_MEDIUM','score');
        detection.decline();detection.fire();
        end;
        else if ('risk_level' = 'LOW') then do;
          profile.customer.ACB_SCORE_3=index('acb_score.R04_LOW','score');
        detection.decline();detection.fire();
        end;

        end;

        end;

        end;

