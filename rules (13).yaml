    - authoringMethod: code
      baseRuleId: "51577"
      code: "\r\nif message.payment.type in ('ATM WITHDRAWAL', 'BILL PAYMENT', 'FUND TRANSFER') then do;\r\n    dcl int debit_amt;\r\n    dcl int i;\r\n    dcl int value;\r\n    \r\n    debit_amt = 0;\r\n    if lists.bidv_threshold.lookup('R03_sender_window_hr') then do;\r\n        value = listValues.bidv_threshold.threshold;\r\n        do i = 1 to 24;\r\n            if not missing(profile.customer_beneficiary.PREV_DEBIT_TXN_DT_HR[i]) and\r\n               message.payment.createdDt - profile.customer_beneficiary.PREV_DEBIT_TXN_DT_HR[i] < dhms(0,value,0,0) then do;\r\n                debit_amt = debit_amt + profile.customer_beneficiary.PREV_DEBIT_TXN_AMT_HR[i];\r\n            end;\r\n        end;\r\n    end;\r\n\r\n    if lists.bidv_threshold.lookup('R03_cumulative_amount') then do;\r\n        if debit_amt >= (listValues.bidv_threshold.threshold) and profile.beneficiary.mule_flag = 1 then do;           \r\n                profile.customer.RULE_SCORE_3 = 200;\r\n                profile.customer.fired_rule_desc='Identify beneficiary accounts potentially used as mule accounts';\r\n                profile.customer.fired_rule_name='BIDV_R03 Mule Enrolment';\r\n        end;\r\n    end;\r\nend;"
