    - alertType: sfd_customer
      authoringMethod: code
      baseRuleId: "51499"
      code: "if message.payment.type='LOAN APPLICATION' then do ;\r\n\tdcl int shared_device;\r\n\tdcl int shared_ip;\r\n\tshared_device=0;\r\n\tshared_ip=0;\r\n\tdo i = 1 to 10;  \r\n\t\tif not missing(profile.deviceId.UniqueCustomer[i]) and message.payment.createdDt-profile.deviceId.DEVICE_CUST_LOGIN_DT[i]<dhms(7,0,0,0) then do;\r\n\t\t\tshared_device = shared_device + 1;\r\n\t\tend;\r\n\t\tif not missing(profile.ip.UniqueCustomer[i])and message.payment.createdDt-profile.ip.IP_CUST_LOGIN_DT[i]<dhms(7,0,0,0) then do;\r\n\t\t\tshared_ip = shared_ip + 1;\r\n\t\tend;\r\n\tend;\r\n\tif shared_device >= 3 or shared_ip >= 3 then do;\r\n\t    profile.customer.Rule_score_1=400;\r\n\t\tdetection.alert();\r\n\tend;\r\n/*  --- Condition 2: Shared Personal Identifiers --- */\r\n else do; \r\n\t dcl int shared_phone;\r\n\t dcl int shared_email;\r\n\t dcl int shared_employer_name;\r\n\t shared_phone = 0 ;\r\n\t  shared_email = 0 ;\r\n\t  shared_employer_name = 0 ;\r\n\tdo i = 1 to 7;\r\n\t\tif not missing(profile.phonenumber.last_Unique_customer_ID[i]) and message.payment.createdDt-profile.phonenumber.last_Unique_customer_DT[i]<dhms(14,0,0,0) then do;\r\n\t\t\tshared_phone=shared_phone+1;\r\n\t\tend;\r\n\t\tif not missing(profile.email.last_Unique_customer_ID[i]) and message.payment.createdDt-profile.email.last_Unique_customer_DT[i]<dhms(14,0,0,0) then do;\r\n\t\t\tshared_email=shared_email+1;\r\n\t\tend;\r\n\t\tif not missing(profile.employerName.last_Unique_customer_ID[i]) and message.payment.createdDt-profile.employerName.last_Unique_customer_DT[i]<dhms(14,0,0,0) then do;\r\n\t\t\tshared_employer_name=shared_employer_name+1;\r\n\t\tend;\r\n\tend;\r\n\tif shared_phone >=3 or shared_email>=3 or shared_employer_name>=3 then do;\r\n\t    profile.customer.Rule_score_1=400;\r\n\t\tdetection.Fire();\r\n\tend;\r\n   end; \r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-08-17T06:27:20.603967Z"
