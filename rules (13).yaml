    - authoringMethod: code
      baseRuleId: "51525"
      code: "/*Condition 1*/\r\nif message.payment.type = 'LOGIN' then do;\r\n    dcl int unique_cust_count_ip;\r\n    dcl int unique_cust_count_dev;\r\n    unique_cust_count_ip = 0;\r\n    unique_cust_count_dev = 0;\r\n\r\n    /* --- Check IP-based customer login history --- */\r\n    do i=1 to 10;\r\n        if not missing(profile.ip.IP_CUST_LOGIN_DT[i]) then do;\r\n            if (message.payment.createdDt - profile.ip.IP_CUST_LOGIN_DT[i]) < dhms(1,0,0,0) then do;\r\n                if profile.ip.UniqueCustomer[i] ^= message.customer.identifier then do;\r\n                    unique_cust_count_ip = unique_cust_count_ip + 1;\r\n                end;\r\n            end;\r\n        end;\r\n    end;\r\n\r\n    /* --- Check DeviceID-based customer login history --- */\r\n    do i = 1 to 10;\r\n        if not missing(profile.device.DEVICE_CUST_LOGIN_DT[i]) then do;\r\n            if (message.payment.createdDt - profile.device.DEVICE_CUST_LOGIN_DT[i]) < dhms(1,0,0,0) then do;\r\n                if profile.device.UniqueCustomer[i] ^= message.customer.identifier then do;\r\n                    unique_cust_count_dev = unique_cust_count_dev + 1;\r\n                end;\r\n            end;\r\n        end;\r\n    end;\r\n\r\n    /* --- If either device or IP has ≥ 2 other customers (=> 3 total) and IP not whitelisted --- */\r\n    if (unique_cust_count_ip >= 2 or unique_cust_count_dev >= 2) then do;\r\n        if not lists.sacombank_whitelist.contains(message.device.ipAddress) then do;\r\n            profile.customer.RULE_SCORE_7A = 100;\r\n        end;\r\n    end;\r\nend;\r\n\r\n/*Condition 2*/\r\nif message.payment.type = 'LOGIN' then do;\r\n    dcl int ip_triggered;\r\n    dcl int device_triggered;\r\n    if not lists.sacombank_whitelist.contains(message.device.ipAddress) then do;\r\n        ip_triggered = 0;\r\n        device_triggered = 0;\r\n\r\n        if missing(profile.customerXip.prev_login_DT) or \r\n           (profile.customerXip.curr_login_DT - profile.customerXip.prev_login_DT) > dhms(90,0,0,0) then do;\r\n            ip_triggered = 1;\r\n        end;\r\n\r\n        if missing(profile.customerXdevice.prev_login_DT) or \r\n           (profile.customerXdevice.curr_login_DT - profile.customerXdevice.prev_login_DT) > dhms(90,0,0,0) then do;\r\n            device_triggered = 1;\r\n        end;\r\n\r\n        if ip_triggered = 1 or device_triggered = 1 then do;\r\n            profile.customer.RULE_SCORE_7B = 200;\r\n        end;\r\n    end;\r\nend;\r\n\r\n/*Condition 3*/\r\nif message.payment.type in ('FUND TRANSFER') then do;\r\n    if message.payment.createdDt - profile.customer.CUR_LOGIN_DT <= dhms(0,0,30,0) then do;\r\n        profile.customer.RULE_SCORE_7C =300;\r\n    end;\r\nend;\r\n\r\nif profile.customer.RULE_SCORE_7A=100 and profile.customer.RULE_SCORE_7B=200 and profile.customer.RULE_SCORE_7C=300 then do;\r\n    profile.customer.RULE_SCORE_7 = 600;\r\n    detection.Fire();\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-08-12T06:56:10.887828Z"
