    - authoringMethod: code
      baseRuleId: "51566"
      code: "/* CIMB R05 - Device Change Detection                       */\r\n/* Trigger based on last 2 devices                          */\r\n/*==========================================================*/\r\nif message.payment.type = 'LOGIN' then do;\r\n\r\n    dcl int new_ip;\r\n    dcl int new_device;\r\n    dcl double change_window;\r\n\r\n    new_ip = 0;\r\n    new_device = 0;\r\n    change_window = 0;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Get configured threshold                             */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup('R05_LOGIN_CHANGE_WINDOW_MIN') then do;\r\n\r\n        change_window =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Identify new IP                                      */\r\n    /*------------------------------------------------------*/\r\n\r\n    if not missing(profile.customerXip.curr_login_DT)\r\n       and missing(profile.customerXip.prev_login_DT) then do;\r\n\r\n        new_ip = 1;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Identify new Device                                  */\r\n    /*------------------------------------------------------*/\r\n\r\n    if not missing(profile.customerXdevice.curr_login_DT)\r\n       and missing(profile.customerXdevice.prev_login_DT) then do;\r\n\r\n        new_device = 1;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Check sudden change from previous customer login     */\r\n    /*------------------------------------------------------*/\r\n\r\n    if not missing(profile.customer.PREV_LOGIN_DT)\r\n       and not missing(profile.customer.CUR_LOGIN_DT)\r\n       and (new_ip = 1 or new_device = 1)\r\n       and profile.customer.CUR_LOGIN_DT >\r\n           profile.customer.PREV_LOGIN_DT\r\n       and profile.customer.CUR_LOGIN_DT -\r\n           profile.customer.PREV_LOGIN_DT <=\r\n           dhms(0,0,change_window,0) then do;\r\n\r\n\r\n        /*--------------------------------------------------*/\r\n        /* Apply R05 score                                 */\r\n        /*--------------------------------------------------*/\r\n\r\n        if lists.cimb_score.lookup('R05') then do;\r\n\r\n            profile.customer.Rule_score_5 =\r\n                listValues.cimb_score.score;\r\n\r\n            profile.customer.fired_rule_name='CIMB R05 - Device and IP Change Detection';\r\n            profile.customer.fired_rule_desc='Detect potentially unauthorized access by identifying a sudden change in customers IP or device shortly after previous login';\r\n\r\n            detection.Fire();\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;"
