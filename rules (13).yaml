    - authoringMethod: code
      baseRuleId: "51575"
      code: "if message.payment.type in ('FUND TRANSFER','BILL PAYMENT') then do;\r\n\r\nprofile.customer.rule_score_2 = 0;\r\n\r\n/* High value transaction */\r\nif lists.bidv_threshold.lookup('R02_transaction_amount') then do;\r\n    if message.payment.amount > listValues.bidv_threshold.threshold  then do;\r\n        if lists.bidv_score.lookup('R02_1') then do;\r\n        profile.customer.rule_score_2A = listValues.bidv_score.score;\r\n        end;\r\n    end;\r\nend;\r\n\r\n\r\n/* Unusual hours: 22:01 - 06:59 UTC+7 */\r\nif lists.bidv_threshold.lookup('R02_time_window_start_hr') then do;\r\nif not missing(message.payment.debitDt) and (hour(message.payment.debitDt) >= listValues.bidv_threshold.threshold)  then do;\r\n    if lists.bidv_score.lookup('R02_2') then do;\r\n    profile.customer.rule_score_2B =listValues.bidv_score.score;\r\n    end;\r\nend;\r\nend;\r\n\r\nif lists.bidv_threshold.lookup('R02_time_window_end_hr') then do;\r\n    if not missing(message.payment.debitDt) and (hour(message.payment.debitDt) < listValues.bidv_threshold.threshold) then do;\r\n        if lists.bidv_score.lookup('R02_2') then do;\r\n        profile.customer.rule_score_2B =listValues.bidv_score.score;\r\n        end;\r\n    end;\r\nend;\r\n\r\n\r\n/* IP country*/\r\n if lists.bidv_ipAddress.lookup(message.device.ipAddress) then do;\r\n\r\n    if  listValues.bidv_ipAddress.country= 'Russia' then do;\r\n        if lists.bidv_score.lookup('R02_3') then do;\r\n        profile.customer.rule_score_2C = listValues.bidv_score.score;\r\n        end;\r\n    end;\r\nend;\r\n\r\n\r\n/* Network risk */\r\nif lists.bidv_threshold.lookup('R02_network_risk_limit') then do;\r\nif lists.bidv_graphScore.lookup(message.creditaccount.number)  then do;\r\n    if listValues.bidv_graphScore.score >= listValues.bidv_threshold.threshold then do;\r\n        if lists.bidv_score.lookup('R02_4') then do;\r\n        profile.customer.rule_score_2D = listValues.bidv_score.score;\r\n        end;\r\n    end;\r\nend;\r\nend;\r\n\r\nif lists.bidv_muleCluster.contains(message.creditaccount.number) then do;\r\n    if lists.bidv_score.lookup('R02_4') then do;\r\n        profile.customer.rule_score_2D = listValues.bidv_score.score;\r\n    end;\r\nend;\r\n\r\n\r\nprofile.customer.rule_score_2=profile.customer.rule_score_2A+profile.customer.rule_score_2B+profile.customer.rule_score_2C+profile.customer.rule_score_2D;\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-10-07T11:05:58.883597Z"
