    - authoringMethod: code
      baseRuleId: "51569"
      code: "/*-----------------------------------------*/\r\n/* LOGIN / FINANCIAL ACTIVITY              */\r\n/*-----------------------------------------*/\r\n\r\nif message.payment.type in\r\n   ('LOGIN',\r\n    'FUND TRANSFER',\r\n    'BILL PAYMENT') and \r\n    message.device.browserLanguage = 'MOBILE' then do;\r\n\r\n    dcl int found_device;\r\n    dcl int found_ip;\r\n    dcl int found_account;\r\n    dcl int i;\r\n    dcl int j;\r\n\r\n    found_device  = 0;\r\n    found_ip      = 0;\r\n    found_account = 0;\r\n\r\n\r\n    /*-----------------------------------------*/\r\n    /* Maintain Last 10 Unique Devices        */\r\n    /*-----------------------------------------*/\r\n\r\n    if not missing(message.device.macAddress) then do;\r\n\r\n        do i = 1 to 10;\r\n\r\n            if not missing(\r\n                   profile.customer.LAST_UNIQUE_DEVICE_ID[i])\r\n               and profile.customer.LAST_UNIQUE_DEVICE_ID[i] =\r\n                   message.device.macAddress then do;\r\n\r\n                found_device = 1;\r\n                leave;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n        if found_device = 0 then do;\r\n\r\n            do i = 10 to 2 by -1;\r\n\r\n                profile.customer.LAST_UNIQUE_DEVICE_ID[i] =\r\n                    profile.customer.LAST_UNIQUE_DEVICE_ID[i-1];\r\n\r\n            end;\r\n\r\n            profile.customer.LAST_UNIQUE_DEVICE_ID[1] =\r\n                message.device.macAddress;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n\r\n    /*-----------------------------------------*/\r\n    /* Maintain Last 10 Unique IPs            */\r\n    /*-----------------------------------------*/\r\n\r\n    if not missing(message.device.ipAddress) then do;\r\n\r\n        do i = 1 to 10;\r\n\r\n            if not missing(profile.customer.LAST_UNIQUE_IP[i])\r\n               and profile.customer.LAST_UNIQUE_IP[i] =\r\n                   message.device.ipAddress then do;\r\n\r\n                found_ip = 1;\r\n                leave;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n        if found_ip = 0 then do;\r\n\r\n            do i = 10 to 2 by -1;\r\n\r\n                profile.customer.LAST_UNIQUE_IP[i] =\r\n                    profile.customer.LAST_UNIQUE_IP[i-1];\r\n\r\n            end;\r\n\r\n            profile.customer.LAST_UNIQUE_IP[1] =\r\n                message.device.ipAddress;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n\r\n    /*-----------------------------------------*/\r\n    /* Maintain Device-Account Association    */\r\n    /*-----------------------------------------*/\r\n\r\n    if not missing(message.device.macAddress) then do;\r\n\r\n        do i = 1 to 5;\r\n\r\n            if not missing(profile.deviceId.ACCT_MAC[i])\r\n               and profile.deviceId.ACCT_MAC[i] =\r\n                   message.debitaccount.iban then do;\r\n\r\n                profile.deviceId.ACCT_MAC_DT[i] =\r\n                    message.payment.createdDt;\r\n\r\n                found_account = 1;\r\n\r\n                leave;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n\r\n        /*-----------------------------------------*/\r\n        /* Add New Account                         */\r\n        /*-----------------------------------------*/\r\n\r\n        if found_account = 0 then do;\r\n\r\n            do i = 5 to 2 by -1;\r\n\r\n                j = i - 1;\r\n\r\n                profile.deviceId.ACCT_MAC[i] =\r\n                    profile.deviceId.ACCT_MAC[j];\r\n\r\n                profile.deviceId.ACCT_MAC_DT[i] =\r\n                    profile.deviceId.ACCT_MAC_DT[j];\r\n\r\n            end;\r\n\r\n            profile.deviceId.ACCT_MAC[1] =\r\n                message.debitaccount.iban;\r\n\r\n            profile.deviceId.ACCT_MAC_DT[1] =\r\n                message.payment.createdDt;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;\r\n"
      createdBy: sas
      creationTimeStamp: "2026-10-08T09:46:49.852727Z"
