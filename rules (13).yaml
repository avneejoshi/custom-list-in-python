    - authoringMethod: code
      baseRuleId: "51492"
      code: "dcl int matched;\r\ndcl int j;\r\nif message.payment.type = 'LOAN APPLICATION' then do;\r\n    j=0;  \r\n    matched=0;\r\n   if missing(profile.phonenumber.last_Unique_customer_ID[1]) then do;\r\n      profile.phonenumber.last_Unique_customer_DT[1] = message.payment.createdDt;\r\n      profile.Phonenumber.last_Unique_customer_ID[1] = message.customer.identifier;\r\n   end;\r\n   else do;\r\n      matched = 0;\r\n      do i = 1 to 7;\r\n         if profile.phonenumber.last_Unique_customer_ID[i] = message.customer.identifier then do;\r\n            profile.phonenumber.last_Unique_customer_DT[i] = message.payment.createdDt;\r\n            matched = 1;\r\n            leave;\r\n         end;\r\n      end;\r\n      if matched = 0 then do;\r\n         do i = 7 to 2 by -1;\r\n            j = i - 1;\r\n            profile.phonenumber.last_Unique_customer_ID[i] = profile.phonenumber.last_Unique_customer_ID[j];\r\n            profile.phonenumber.last_Unique_customer_DT[i] = profile.phonenumber.last_Unique_customer_DT[j];\r\n         end;\r\n         profile.phonenumber.last_Unique_customer_ID[1] = message.customer.identifier;\r\n         profile.phonenumber.last_Unique_customer_DT[1] = message.payment.createdDt;\r\n      end;\r\n   end;\r\nend;\r\n\r\nif message.payment.type='LOAN APPLICATION' then do;\r\n   j=0;\r\n   matched=0;\r\n   if missing(profile.email.last_Unique_customer_ID[1]) then do;\r\n      profile.email.last_Unique_customer_DT[1] = message.payment.createdDt;\r\n      profile.email.last_Unique_customer_ID[1] = message.customer.identifier;\r\n   end;\r\n   else do;\r\n      matched = 0;\r\n      do i = 1 to 7;\r\n         if profile.email.last_Unique_customer_ID[i] = message.customer.identifier then do;\r\n            profile.email.last_Unique_customer_DT[i] = message.payment.createdDt;\r\n            matched = 1;\r\n            leave;\r\n         end;\r\n      end;\r\n      if matched = 0 then do;\r\n         do i = 7 to 2 by -1;\r\n            j = i - 1;\r\n            profile.email.last_Unique_customer_ID[i] = profile.email.last_Unique_customer_ID[j];\r\n            profile.email.last_Unique_customer_DT[i] = profile.email.last_Unique_customer_DT[j];\r\n         end;\r\n         profile.email.last_Unique_customer_ID[1] = message.customer.identifier;\r\n         profile.email.last_Unique_customer_DT[1] = message.payment.createdDt;\r\n      end;\r\n   end;\r\nend;\r\n \r\nif message.payment.type='LOAN APPLICATION' then do;\r\n   j=0;\r\n   matched=0; \r\n   if missing(profile.employerName.last_Unique_customer_ID[1]) then do;\r\n      profile.employerName.last_Unique_customer_DT[1] = message.payment.createdDt;\r\n      profile.employerName.last_Unique_customer_ID[1] = message.customer.identifier;\r\n   end;\r\n   else do;\r\n      matched = 0;\r\n      do i = 1 to 7;\r\n         if profile.employerName.last_Unique_customer_ID[i] = message.customer.identifier then do;\r\n            profile.employerName.last_Unique_customer_DT[i] = message.payment.createdDt;\r\n            matched = 1;\r\n            leave;\r\n         end;\r\n      end;\r\n      if matched = 0 then do;\r\n         do i = 7 to 2 by -1;\r\n            j = i - 1;\r\n            profile.employerName.last_Unique_customer_ID[i] = profile.employerName.last_Unique_customer_ID[j];\r\n            profile.employerName.last_Unique_customer_DT[i] = profile.employerName.last_Unique_customer_DT[j];\r\n         end;\r\n         profile.employerName.last_Unique_customer_ID[1] = message.customer.identifier;\r\n         profile.employerName.last_Unique_customer_DT[1] = message.payment.createdDt;\r\n      end;\r\n   end;\r\nend;\r\n\r\nif message.payment.type = 'LOAN APPLICATION' then do;\r\n      if missing(profile.deviceId.DEVICE_CUST_LOGIN_DT[1]) then do;\r\n         profile.deviceId.DEVICE_CUST_LOGIN_DT[1] = message.payment.createdDt;\r\n         profile.deviceId.UniqueCustomer[1]= message.customer.identifier;\r\n      end;\r\n      else do;\r\n      dcl int match_dev;\r\n         match_dev = 0;\r\n         do i = 1 to 10;\r\n            if profile.deviceId.UniqueCustomer[i] = message.customer.identifier then do;\r\n               profile.deviceId.DEVICE_CUST_LOGIN_DT[i]=message.payment.createdDt;\r\n               match_dev = 1;\r\n               leave; \r\n            end;\r\n         end;\r\n         if match_dev = 0 then do;\r\n         dcl int a;\r\n            do i = 10 to 2 by -1;\r\n               a = i-1;\r\n               profile.deviceId.UniqueCustomer[i] = profile.deviceId.UniqueCustomer[a];\r\n               profile.deviceId.DEVICE_CUST_LOGIN_DT[i]=profile.deviceId.DEVICE_CUST_LOGIN_DT[a];\r\n            end;\r\n           profile.deviceId.UniqueCustomer[1] =  message.customer.identifier;\r\n           profile.deviceId.DEVICE_CUST_LOGIN_DT[1]=message.payment.createdDt;\r\n         end;\r\n      end;\r\nend;\r\n\r\nif message.payment.type = 'LOAN APPLICATION' then do;\r\n      if missing(profile.ip.IP_CUST_LOGIN_DT[1]) then do;\r\n         profile.ip.IP_CUST_LOGIN_DT[1] = message.payment.createdDt;\r\n         profile.ip.UniqueCustomer[1]= message.customer.identifier;\r\n      end;\r\n      else do;\r\n      dcl int match_ip;\r\n         match_ip = 0;\r\n         do i = 1 to 10;\r\n            if profile.ip.UniqueCustomer[i] = message.customer.identifier then do;\r\n               profile.ip.IP_CUST_LOGIN_DT[i]=message.payment.createdDt;\r\n               match_ip = 1;\r\n               leave; \r\n            end;\r\n         end;\r\n         if match_ip = 0 then do;\r\n         dcl int b;\r\n            do i = 10 to 2 by -1;\r\n               b = i-1;\r\n               profile.ip.UniqueCustomer[i] = profile.ip.UniqueCustomer[b];\r\n               profile.ip.IP_CUST_LOGIN_DT[i]=profile.ip.IP_CUST_LOGIN_DT[b];\r\n            end;\r\n           profile.ip.UniqueCustomer[1] =  message.customer.identifier;\r\n           profile.ip.IP_CUST_LOGIN_DT[1]=message.payment.createdDt;\r\n         end;\r\n      end;\r\n   end;\r\n\r\nif message.payment.type='LOGIN' then do;   \r\n    profile.customerXip.prev_login_DT = profile.customerXip.curr_login_DT;\r\n    profile.customerXdevice.prev_login_DT = profile.customerXdevice.curr_login_DT;\r\n    profile.customer.PREV_LOGIN_DT = profile.customer.CUR_LOGIN_DT;\r\n\r\n    profile.customerXip.curr_login_DT = message.payment.createdDt;\r\n    profile.customerXdevice.curr_login_DT = message.payment.createdDt;\r\n    profile.customer.CUR_LOGIN_DT =  message.payment.createdDt;\r\nend;"
