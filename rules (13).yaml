    - authoringMethod: assistant
      baseRuleId: "51578"
      code: |+
        if (message.payment.type IN ('CREDIT','FUND TRANSFER')) then do;
          if (profile.beneficiary.mule_flag & sum(message.batch.totalDebitAmount,24) > 400000000) then do;
          detection.decline();profile.customer.RULE_SCORE_3=detection.score('R03');

        end;

        end;

