    - alertType: sfd_customer
      authoringMethod: code
      baseRuleId: "51504"
      code: "/* ================= CUSTOMER AGGREGATION ================= */\r\n\r\nif message.payment.type = 'CUST DETAIL CHANGE' then do;\r\n\r\n    profile.customer.AGG_Rule_Score =\r\n        profile.customer.ACB_SCORE_3;\r\n\r\n    if profile.customer.AGG_Rule_Score > 300 then do;\r\n        detection.Alert();\r\n        detection.Decline();\r\n        profile.customer.Alertoutput = 'Decline';\r\n    end;\r\n    else do;\r\n        detection.Approve();\r\n        profile.customer.Alertoutput = 'Approve';\r\n    end;\r\n\r\nend;"
