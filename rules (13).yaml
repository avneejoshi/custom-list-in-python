    - alertType: sfd_creditcard
      authoringMethod: code
      baseRuleId: "51502"
      code: "/* ================= CARD AGGREGATION ================= */\r\n\r\nif message.payment.type in ('ECOM','POS') then do;\r\n\r\n    profile.customer.AGG_Rule_Score =\r\n          profile.customer.ACB_SCORE_1\r\n        + profile.customer.ACB_SCORE_2 + profile.customer.RULE_SCORE_4;\r\n\r\n    if profile.customer.AGG_Rule_Score > 300 then do;\r\n        detection.Alert();\r\n        detection.Decline();\r\n        profile.customer.Alertoutput = 'Decline';\r\n    end;\r\n    else do;\r\n        detection.Approve();\r\n        profile.customer.Alertoutput = 'Approve';\r\n    end;\r\n\r\nend;"
