      code: "/*-----------------------------------------*/\r\n/* ACB P05 Shared Device Accounts          */\r\n/*-----------------------------------------*/\r\n\r\nif message.payment.type in\r\n   ('FUND TRANSFER','BILL PAYMENT') then do;\r\n\r\n    dcl int match_found;\r\n    dcl int j;\r\n    dcl int i;\r\n\r\n    match_found = 0;\r\n\r\n    if missing(profile.deviceId.ACCT_MAC_DT[1]) then do;\r\n\r\n        profile.deviceId.ACCT_MAC[1] =\r\n            message.debitaccount.iban;\r\n\r\n        profile.deviceId.ACCT_MAC_DT[1] =\r\n            message.payment.createdDt;\r\n\r\n    end;\r\n\r\n    else do;\r\n\r\n        /* Check whether account already exists */\r\n        do i = 1 to 5;\r\n\r\n            if profile.deviceId.ACCT_MAC[i] =\r\n               message.debitaccount.iban then do;\r\n\r\n                profile.deviceId.ACCT_MAC_DT[i] =\r\n                    message.payment.createdDt;\r\n\r\n                match_found = 1;\r\n\r\n                leave;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n        /* New account */\r\n        if match_found = 0 then do;\r\n\r\n            /* Shift existing accounts */\r\n            do i = 5 to 2 by -1;\r\n\r\n                j = i - 1;\r\n\r\n                profile.deviceId.ACCT_MAC[i] =\r\n                    profile.deviceId.ACCT_MAC[j];\r\n\r\n                profile.deviceId.ACCT_MAC_DT[i] =\r\n                    profile.deviceId.ACCT_MAC_DT[j];\r\n\r\n            end;\r\n\r\n            /* Store latest account */\r\n            profile.deviceId.ACCT_MAC[1] =\r\n                message.debitaccount.iban;\r\n\r\n            profile.deviceId.ACCT_MAC_DT[1] =\r\n                message.payment.createdDt;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:05:33.517839Z"
      description: A single unique device identifier used to perform transactions for more than 01 payment account
      errorType: 0
      executionOrderType: 0
