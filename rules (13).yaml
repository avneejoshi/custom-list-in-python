    - authoringMethod: code
      baseRuleId: "51539"
      code: "/*-----------------------------------------*/\r\n/* ACB P06 Dormant Account Reactivation    */\r\n/*-----------------------------------------*/\r\n\r\nif message.payment.type in\r\n   ('FUND TRANSFER',\r\n    'BILL PAYMENT',\r\n    'POS',\r\n    'ECOM',\r\n    'MOBILE WALLETS',\r\n    'ATM WITHDRAWAL',\r\n    'CREDIT') then do;\r\n\r\n    profile.account.LAST_TXN_DTTM =\r\n        message.payment.createdDt;\r\n\r\nend;\r\n\r\n\r\n/* Dormant account reactivation */\r\n\r\nif message.payment.type = 'ACC REACTIVATION' then do;\r\n\r\n    if not missing(profile.account.LAST_TXN_DTTM)\r\n       and message.payment.createdDt -\r\n           profile.account.LAST_TXN_DTTM >=\r\n           dhms(180,0,0,0) then do;\r\n\r\n        profile.account.REACTIVATION_DTTM =\r\n            message.payment.createdDt;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:05:47.807522Z"
      description: Profile rule for reactivation of a Dormant Account + Full Withdrawal
