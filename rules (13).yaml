    - authoringMethod: code
      baseRuleId: "51513"
      code: "if message.payment.type = 'LOGIN' and message.authentication.event = 'OTP' then do;\r\nif not missing(message.device.ipAddress) then do;\r\n    dcl int found_ip;\r\n    dcl int i;\r\n    found_ip = 0;\r\n    do i = 1 to 10;\r\n        if profile.customer.LAST_UNIQUE_IP[i] = message.device.ipAddress then do;\r\n        found_ip = 1;\r\n        profile.customer.customer_present= 1;\r\n        end;\r\n    end;\r\n    if found_ip = 0 then do;\r\n        do i = 10 to 2 by -1;\r\n            profile.customer.LAST_UNIQUE_IP[i] = profile.customer.LAST_UNIQUE_IP[i-1];\r\n        end;\r\n        profile.customer.LAST_UNIQUE_IP[1] = message.device.ipAddress;\r\n\r\n    end;\r\nend;\r\n\r\nif not missing(message.device.macAddress) then do;\r\n    dcl int found_dev;\r\n    dcl int j;\r\n    found_dev = 0;\r\n    do j = 1 to 10;   \r\n        if profile.customer.LAST_UNIQUE_DEVICE_ID[j] = message.device.macAddress then do;\r\n        found_dev = 1;\r\n        profile.customer.customer_present= 1;\r\n        end;\r\n    end;\r\n    if found_dev = 0 then do;\r\n        do i = 10 to 2 by -1;\r\n            profile.customer.LAST_UNIQUE_DEVICE_ID[j] = profile.customer.LAST_UNIQUE_DEVICE_ID[j-1];\r\n        end;\r\n        profile.customer.LAST_UNIQUE_DEVICE_ID[1] = message.device.macAddress;\r\n    end;\r\nend;\r\nend;\r\n\r\nif message.payment.type = 'BENEFICIARY ADDITION' then do; \r\nprofile.customer_beneficiary.ADD_DT = message.payment.createdDt;\r\nend;"
