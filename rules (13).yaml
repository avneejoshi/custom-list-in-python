    - alertType: sfd_customer
      authoringMethod: code
      baseRuleId: "51503"
      code: "/* ================= ACCOUNT AGGREGATION ================= */\r\n\r\nif message.payment.type in\r\n   ('FUND TRANSFER','BILL PAYMENT','CASH WITHDRAWAL','ACC REACTIVATION','CREDIT') then do;\r\n\r\n    profile.customer.AGG_Rule_Score = profile.customer.RULE_SCORE_2 +\r\n          profile.customer.ACB_SCORE_4\r\n        + profile.customer.ACB_SCORE_5\r\n\t\t+ profile.customer.ACB_SCORE_6;\r\n\r\n    if profile.customer.AGG_Rule_Score >= 100 then do;\r\n        detection.Alert();\r\n        detection.Decline();\r\n        profile.customer.Alertoutput = 'Decline';\r\n    end;\r\n    else do;\r\n        detection.Approve();\r\n        profile.customer.Alertoutput = 'Approve';\r\n    end;\r\n\r\nend;"
