    - authoringMethod: code
      baseRuleId: "51536"
      code: "/* ================= ACB P02 PROFILE ================= */\r\nif message.payment.type = 'POS' then do;\r\n    dcl int i;\r\n    dcl int k;\r\n    if missing(profile.creditcard.POS_TXN_DT_HR[1]) then do;\r\n\r\n        profile.creditcard.POS_TXN_DT_HR[1]  = message.payment.createdDt;\r\n        profile.creditcard.POS_TXN_CNT_HR[1] = 1;\r\n        profile.creditcard.POS_TXN_AMT_HR[1] = message.payment.amount;\r\n\r\n    end;\r\n\r\n    else if message.payment.createdDt -\r\n             profile.creditcard.POS_TXN_DT_HR[1] < dhms(0,1,0,0) then do;\r\n\r\n        profile.creditcard.POS_TXN_CNT_HR[1] =\r\n            profile.creditcard.POS_TXN_CNT_HR[1] + 1;\r\n\r\n        profile.creditcard.POS_TXN_AMT_HR[1] =\r\n            profile.creditcard.POS_TXN_AMT_HR[1] +\r\n            message.payment.amount;\r\n\r\n    end;\r\n\r\n    else do;\r\n\r\n        do i = 24 to 2 by -1;\r\n\r\n            k = i - 1;\r\n\r\n            profile.creditcard.POS_TXN_DT_HR[i] =\r\n                profile.creditcard.POS_TXN_DT_HR[k];\r\n\r\n            profile.creditcard.POS_TXN_CNT_HR[i] =\r\n                profile.creditcard.POS_TXN_CNT_HR[k];\r\n\r\n            profile.creditcard.POS_TXN_AMT_HR[i] =\r\n                profile.creditcard.POS_TXN_AMT_HR[k];\r\n\r\n        end;\r\n\r\n        profile.creditcard.POS_TXN_DT_HR[1] =\r\n            message.payment.createdDt;\r\n\r\n        profile.creditcard.POS_TXN_CNT_HR[1] = 1;\r\n\r\n        profile.creditcard.POS_TXN_AMT_HR[1] =\r\n            message.payment.amount;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:05:04.691917Z"
