      code: "dcl int i;\r\ndcl int j;\r\ndcl int recent_loan_count;\r\ndcl int recent_loan_by_same_officer_count;\r\nif message.payment.type='LOAN APPLICATION' then do;\r\n    /* --- Condition 1: Excessive Applications by the Same Customer --- */\r\n    recent_loan_count = 0;\r\n    i=0;\r\n    do i = 1 to 10; \r\n        if not missing(profile.customer.Last_10_loan_ID[i]) and\r\n           message.payment.createdDt - profile.customer.Last_10_loan_DT[i] < dhms(42,0,0,0) then do; \r\n            recent_loan_count = recent_loan_count + 1;\r\n        end;\r\n    end;\r\n \r\n    /* --- Condition 2: Frequent Applications Handled by the Same Credit Officer --- */\r\n    j=0;\r\n    recent_loan_by_same_officer_count = 0;\r\n    do j = 1 to 10;  \r\n        if not missing(profile.customerXoffcierID.Last_10_loan_ID[j]) and \r\n           message.payment.createdDt - profile.customerXoffcierID.Last_10_loan_DT[j] < dhms(42,0,0,0) then do; \r\n            recent_loan_by_same_officer_count = recent_loan_by_same_officer_count + 1;\r\n        end;\r\n    end;\r\n \r\n    /* --- Final Decision --- */\r\n    if recent_loan_count > 5 and recent_loan_by_same_officer_count > 5 then do;\r\n        profile.customer.Rule_score_5 = 500;\r\n        detection.Fire();\r\n    end;\r\n    else if recent_loan_count > 5 then do;\r\n         profile.customer.Rule_score_5 = 200;\r\n    end;\r\n    else if recent_loan_by_same_officer_count > 5 then do;\r\n        profile.customer.Rule_score_5 = 300;\r\n    end;\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-08-17T06:27:10.976875Z"
      description: Identifies loan stacking or internal collusion by flagging frequent applications from the same customer processed repeatedly by one credit officer
