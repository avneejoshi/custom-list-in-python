    - alertType: sfd_creditcard
      authoringMethod: code
      baseRuleId: "51521"
      code: "IF message.payment.type = 'POS' OR message.payment.type = 'ECOM' OR message.payment.type = 'MOBILE WALLETS'  THEN DO;\r\n        if lists.blacklisted_merchant.contains(message.merchant.identifier) then do;\r\n                detection.Fire();\r\n                detection.Alert();\r\n                        profile.customer.RULE_SCORE_6 = 400;\r\n        end;\r\nend;"
