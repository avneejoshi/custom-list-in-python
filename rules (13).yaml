    - authoringMethod: code
      baseRuleId: "51498"
      code: "if message.authentication.decision = 'SUCCESS' and message.payment.type in ('ECOM', 'MOBILE WALLETS') then do;\r\n   /* --- Condition 1: Multiple Failed Attempts in Last 1 Hour --- */\r\n   dcl int fail_count;\r\n   dcl int k;\r\n   dcl int j;\r\n   dcl int low_txn_count;\r\n   fail_count = 0;\r\n   low_txn_count = 0;  \r\n\r\n   do j = 1 to 10;\r\n      if not missing(profile.creditcard.FAILED_ATTEMPTS_DT[j]) then do;\r\n         if message.payment.createdDt - profile.creditcard.FAILED_ATTEMPTS_DT[j] <= dhms(0,1,0,0) then do;\r\n            fail_count = fail_count + 1;\r\n         end;\r\n      end;\r\n   end; \r\n\r\n   /* --- Condition 2: At least 3 low-value txns < 100,000 VND within 15 minutes --- */ \r\n   do k = 1 to 10;\r\n      if not missing(profile.creditcard.LAST_TRX_DT[k]) \r\n         and profile.creditcard.LAST_TRX_AMT[k] < 100000 then do;\r\n         if profile.creditcard.LAST_TRX_DT[1] - profile.creditcard.LAST_TRX_DT[k] <= dhms(0,0,15,0) then do;\r\n            low_txn_count = low_txn_count + 1;\r\n         end;\r\n      end;\r\n   end;\r\n\r\n   /* --- Condition 3: Current Transaction Amount > 10,000,000 VND --- */\r\n   if fail_count >= 5 \r\n      and low_txn_count >= 3 \r\n      and message.payment.amount > 10000000 then do;\r\n      profile.customer.RULE_SCORE_4 = 250;\r\n         detection.Fire();\r\n         profile.customer.BLOCK_CODE='CBLK';\r\n   end;\r\nend;\r\n"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:08:15.032576Z"
      description: Identifies compromised cards by detecting failed attempts and low-value test transactions followed by high-value fraud within minutes
      errorType: 0
      executionOrderType: 0
