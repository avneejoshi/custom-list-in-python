    - authoringMethod: code
      baseRuleId: "51561"
      code: "/*------------------------------------------------------------------*/\r\n/* CIMB R02 - Failed Login Profile                                  */\r\n/* Stores the last 5 failed login timestamps                       */\r\n/*------------------------------------------------------------------*/\r\n\r\nif message.payment.status = 'FAILED'\r\n   and message.payment.type = 'LOGIN' then do;\r\n\r\n    dcl int i;\r\n\r\n    /*--------------------------------------------------------------*/\r\n    /* Initialize profile if no previous failed login exists       */\r\n    /*--------------------------------------------------------------*/\r\n\r\n    if missing(profile.customer.LOGIN_FAILED_DT[1]) then do;\r\n\r\n        profile.customer.LOGIN_FAILED_DT[1] =\r\n            message.payment.createdDt;\r\n\r\n    end;\r\n\r\n    /*--------------------------------------------------------------*/\r\n    /* Shift existing non-missing failed login timestamps           */\r\n    /*--------------------------------------------------------------*/\r\n\r\n    else do;\r\n\r\n        do i = 5 to 2 by -1;\r\n\r\n            if not missing(profile.customer.LOGIN_FAILED_DT[i-1]) then do;\r\n\r\n                profile.customer.LOGIN_FAILED_DT[i] =\r\n                    profile.customer.LOGIN_FAILED_DT[i-1];\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n        /* Current failed login becomes most recent */\r\n        profile.customer.LOGIN_FAILED_DT[1] =\r\n            message.payment.createdDt;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-10-08T09:47:25.446261Z"
      description: Profile logic for identifying repeated failed login attempts followed by a successful login.
      errorType: 0
      executionOrderType: 0
      id: 792a70ff-1ec8-4d08-be9c-d059f792328d
      messageClassification: GLOBAL
      messageClassificationId: ced5ac46-825b-46eb-9cc5-734a8bb58654
