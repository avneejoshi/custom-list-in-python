    - authoringMethod: code
      baseRuleId: "51544"
      code: "if message.payment.type = 'FUND TRANSFER'\r\n   or message.payment.type = 'BILL PAYMENT' then do;\r\n\r\n    dcl int acct_count;\r\n    dcl int i;\r\n\r\n    acct_count = 0;\r\n\r\n    do i = 1 to 5;\r\n\r\n        if not missing(profile.deviceId.ACCT_MAC[i])\r\n           and not missing(profile.deviceId.ACCT_MAC_DT[i])\r\n           and message.payment.createdDt >=\r\n               profile.deviceId.ACCT_MAC_DT[i]\r\n           and message.payment.createdDt -\r\n               profile.deviceId.ACCT_MAC_DT[i] <=\r\n               dhms(2,0,0,0) then do;\r\n\r\n            acct_count = acct_count + 1;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n    if lists.acb_threshold.lookup('R05_ACCOUNT_COUNT') then do;\r\n\r\n        if acct_count >\r\n           listValues.acb_threshold.threshold_value then do;\r\n\r\n            if lists.acb_score.lookup('R05') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc='Detects multiple payment accounts being used from the same device/MAC address within the configured lookback period.';\r\n                profile.customer.fired_rule_name='ACB R5 Shared Device Accounts';\r\n\r\n                profile.customer.ACB_SCORE_5 =\r\n                    listValues.acb_score.score;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:07:15.655019Z"
      description: Detects multiple payment accounts being used from the same device/MAC address within the configured lookback period.
