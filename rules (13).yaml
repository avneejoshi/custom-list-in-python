    - authoringMethod: code
      baseRuleId: "51537"
      code: "if message.payment.type='CUST DETAIL CHANGE' then do;\r\n   if message.payment.subType = 'PHONE CHANGE' or message.payment.subType  = 'EMAIL CHANGE' then do;\r\n   dcl int b;\r\n       do i=5 to 2 by -1;\r\n       b=i-1;\r\n       profile.customer.PH_EM_UPDT_DT[i]=profile.customer.PH_EM_UPDT_DT[b];\r\n       end;\r\n       profile.customer.PH_EM_UPDT_DT[1]=message.payment.createdDt;\r\nend;\r\nend;"
