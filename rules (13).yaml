    - authoringMethod: code
      baseRuleId: "51565"
      code: "\r\nif message.payment.type in\r\n   ('FUND TRANSFER','BILL PAYMENT') then do;\r\n\r\n    dcl int sender_count;\r\n    dcl int sender_threshold;\r\n    dcl double sender_window;\r\n    dcl double movement_window;\r\n    dcl double outflow_percent;\r\n    dcl double remaining_balance;\r\n    dcl double credit_amt;\r\n    dcl double debit_amt;\r\n    dcl int i;\r\n\r\n    sender_count = 0;\r\n    credit_amt = 0;\r\n    debit_amt = 0;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Unique sender threshold                              */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R03_UNIQUE_SENDER_COUNT') then do;\r\n\r\n        sender_threshold =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Sender lookback                                      */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R03_SENDER_WINDOW_HOURS') then do;\r\n\r\n        sender_window =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Fund movement window                                 */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R03_FUND_MOVEMENT_WINDOW_MIN') then do;\r\n\r\n        movement_window =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Outflow percentage                                   */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R03_OUTFLOW_PERCENT') then do;\r\n\r\n        outflow_percent =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Remaining balance threshold                          */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R03_REMAINING_BALANCE') then do;\r\n\r\n        remaining_balance =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Count unique incoming sources                        */\r\n    /*------------------------------------------------------*/\r\n\r\n    do i = 1 to 10;\r\n\r\n        if not missing(profile.account.SENDER_ACC[i])\r\n           and not missing(profile.account.SENDER_DT[i])\r\n           and message.payment.createdDt >=\r\n               profile.account.SENDER_DT[i]\r\n           and message.payment.createdDt -\r\n               profile.account.SENDER_DT[i] <=\r\n               dhms(sender_window,0,0,0) then do;\r\n\r\n            sender_count = sender_count + 1;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Calculate incoming/outgoing funds within 30 minutes  */\r\n    /*------------------------------------------------------*/\r\n\r\n    do i = 1 to 60;\r\n\r\n        if not missing(profile.account.PREV_CREDIT_TXN_DT_MIN[i])\r\n           and message.payment.createdDt >=\r\n               profile.account.PREV_CREDIT_TXN_DT_MIN[i]\r\n           and message.payment.createdDt -\r\n               profile.account.PREV_CREDIT_TXN_DT_MIN[i] <=\r\n               dhms(0,0,movement_window,0) then do;\r\n\r\n            credit_amt =\r\n                credit_amt +\r\n                profile.account.PREV_CREDIT_TXN_AMT_MIN[i];\r\n\r\n        end;\r\n\r\n\r\n        if not missing(profile.account.PREV_DEBIT_TXN_DT_MIN[i])\r\n           and message.payment.createdDt >=\r\n               profile.account.PREV_DEBIT_TXN_DT_MIN[i]\r\n           and message.payment.createdDt -\r\n               profile.account.PREV_DEBIT_TXN_DT_MIN[i] <=\r\n               dhms(0,0,movement_window,0) then do;\r\n\r\n            debit_amt =\r\n                debit_amt +\r\n                profile.account.PREV_DEBIT_TXN_AMT_MIN[i];\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Final conditions                                     */\r\n    /*------------------------------------------------------*/\r\n\r\n    if sender_count >= sender_threshold\r\n       and credit_amt > 0\r\n       and debit_amt >=\r\n           (credit_amt * outflow_percent / 100)\r\n       and message.debitaccount.availableBalance <\r\n           remaining_balance then do;\r\n\r\n\r\n        if lists.cimb_score.lookup('R03') then do;\r\n\r\n            profile.customer.Rule_score_3 =\r\n                listValues.cimb_score.score;\r\n\r\n            profile.customer.fired_rule_name = 'CIMB R03 Mule Activity';\r\n            profile.customer.fired_rule_desc = 'Detect accounts potentially used as mule accounts';\r\n            detection.Fire();\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;"
