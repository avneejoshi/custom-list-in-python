    - alertType: sfd_check
      authoringMethod: assistant
      baseRuleId: "51546"
      code: |+
        if (message.payment.type IN ('MOBILE WALLETS','ECOM')) then do;
          if (message.payment.amount > 10000000 & profile.customer.cnt_failed_auth_attmept_1hr >= 5 & profile.customer.cnt_txn_small_amt_5mins >= 3) then do;
          profile.customer.RULE_SCORE_1=250;
        detection.decline();detection.alert();
        end;

        end;

