    - authoringMethod: code
      baseRuleId: "51540"
      code: "if message.payment.type = 'ECOM'\r\n   and message.creditcard.whichCard = 'N'\r\n   and message.authentication.level = 'N'\r\n   and (message.authentication.onlinePaymentCryptogram = 'MISSING'\r\n        or message.authentication.onlinePaymentCryptogram = 'NOT PROVIDED') then do;\r\n\r\n    dcl int distinct_pan_count;\r\n    dcl int i;\r\n\r\n    distinct_pan_count = 0;\r\n\r\n    do i = 1 to 20;\r\n\r\n        if not missing(profile.merchant.PAN[i])\r\n           and not missing(profile.merchant.PAN_DT[i])\r\n           and message.payment.createdDt >= profile.merchant.PAN_DT[i]\r\n           and message.payment.createdDt -\r\n               profile.merchant.PAN_DT[i] <= dhms(0,0,5,0) then do;\r\n\r\n            distinct_pan_count = distinct_pan_count + 1;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n    if lists.acb_threshold.lookup('R01_DISTINCT_PAN') then do;\r\n\r\n        if distinct_pan_count >\r\n           listValues.acb_threshold.threshold_value then do;\r\n\r\n            if lists.acb_score.lookup('R01') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc ='Detects multiple distinct cards used at the same merchant for unauthenticated ECOM transactions within a short time window.';\r\n                profile.customer.fired_rule_name='ACB R1 Merchant Card Testing';\r\n\r\n                profile.customer.ACB_SCORE_1 =\r\n                    listValues.acb_score.score;\r\n                profile.customer.BLOCK_CODE = 'CBLK';\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:06:03.107894Z"
      description: Detects multiple distinct cards used at the same merchant for unauthenticated ECOM transactions within a short time window.
