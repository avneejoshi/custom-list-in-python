    - authoringMethod: code
      baseRuleId: "51516"
      code: "dcl int j;\r\ndcl int matched;\r\nif message.payment.type = 'LOAN APPLICATION' then do;\r\n    j=0;\r\n   /* If first loan for this customer */\r\n   if missing(profile.customer.Last_10_loan_ID[1]) then do;\r\n      profile.customer.Last_10_loan_ID[1] = message.payment.creditReference;\r\n      profile.customer.Last_10_loan_DT[1] = message.payment.createdDt;\r\n   end;\r\n   else do;\r\n      /* Check if this loan already exists in the last 10 */\r\n      matched = 0;\r\n      do i = 1 to 10;\r\n         if profile.customer.Last_10_loan_ID[i] = message.payment.creditReference then do;\r\n            profile.customer.Last_10_loan_DT[i] = message.payment.createdDt;\r\n            matched = 1;\r\n            leave;\r\n         end;\r\n      end;\r\n      /* If not matched, shift and insert new loan at the top */\r\n      if matched = 0 then do;\r\n         do i = 10 to 2 by -1;\r\n            j = i - 1;\r\n            profile.customer.Last_10_loan_ID[i] = profile.customer.Last_10_loan_ID[j];\r\n            profile.customer.Last_10_loan_DT[i] = profile.customer.Last_10_loan_DT[j];\r\n         end;\r\n         profile.customer.Last_10_loan_ID[1] = message.payment.creditReference;\r\n         profile.customer.Last_10_loan_DT[1] = message.payment.createdDt;\r\n      end;\r\n   end;\r\nend;\r\n\r\nif message.payment.type = 'LOAN APPLICATION' then do;\r\n  j=0; \r\n   /* If first loan for this customer-credit officer pair */\r\n   if missing(profile.customerXofficerID.Last_10_loan_ID[1]) then do;\r\n      profile.customerXofficerID.Last_10_loan_ID[1] = message.payment.creditReference;\r\n      profile.customerXofficerID.Last_10_loan_DT[1] = message.payment.createdDt;\r\n   end;\r\n   else do;\r\n      /* Check if this loan already exists in the last 10 */\r\n      matched = 0;\r\n      do i = 1 to 10;\r\n         if profile.customerXofficerID.Last_10_loan_ID[i] = message.payment.creditReference then do;\r\n            profile.customerXofficerID.Last_10_loan_DT[i] = message.payment.createdDt;\r\n            matched = 1;\r\n            leave;\r\n         end;\r\n      end;\r\n      /* If not matched, shift and insert new loan at the top */\r\n      if matched = 0 then do;\r\n         do i = 10 to 2 by -1;\r\n            j = i - 1;\r\n            profile.customerXofficerID.Last_10_loan_ID[i] = profile.customerXofficerID.Last_10_loan_ID[j];\r\n            profile.customerXofficerID.Last_10_loan_DT[i] = profile.customerXofficerID.Last_10_loan_DT[j];\r\n         end;\r\n         profile.customerXofficerID.Last_10_loan_ID[1] = message.payment.creditReference;\r\n         profile.customerXofficerID.Last_10_loan_DT[1] = message.payment.createdDt;\r\n      end;\r\n   end;\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-08-12T06:56:10.841071Z"
