    - authoringMethod: code
      baseRuleId: "51545"
      code: "if message.payment.type = 'CASH WITHDRAWAL'\r\n   and message.payment.direction = 'BRANCH' then do;\r\n\r\n    if not missing(profile.account.REACTIVATION_DTTM)\r\n       and message.payment.createdDt >=\r\n           profile.account.REACTIVATION_DTTM\r\n       and message.payment.createdDt -\r\n           profile.account.REACTIVATION_DTTM <=\r\n           dhms(0,48,0,0) then do;\r\n\r\n        dcl double percentage_threshold;\r\n        dcl double amount_threshold;\r\n\r\n        if lists.acb_threshold.lookup('R06_PERCENT_BALANCE') then do;\r\n\r\n            percentage_threshold =\r\n                listValues.acb_threshold.threshold_value;\r\n\r\n            if lists.acb_threshold.lookup('R06_AMOUNT') then do;\r\n\r\n                amount_threshold =\r\n                    listValues.acb_threshold.threshold_value;\r\n\r\n                if message.payment.amount >=\r\n                   (message.debitaccount.availableBalance *\r\n                    percentage_threshold)\r\n\r\n                   or message.payment.amount >=\r\n                   amount_threshold then do;\r\n\r\n                    if lists.acb_score.lookup('R06') then do;\r\n\r\n                        detection.Fire();\r\n                        profile.customer.fired_rule_desc='Detects large cash withdrawals at a branch shortly after a dormant account is reactivated.';\r\n                        profile.customer.fired_rule_name='ACB R6 Dormant Account Reactivation';\r\n\r\n                        profile.customer.ACB_SCORE_6 =\r\n                            listValues.acb_score.score;\r\n\r\n                    end;\r\n\r\n                end;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:07:34.296939Z"
