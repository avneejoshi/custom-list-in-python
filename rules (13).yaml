    - authoringMethod: code
      baseRuleId: "51576"
      code: "/*Check for unique remitters*/\r\nif message.payment.type in ('CREDIT','FUND TRANSFER','BILL PAYMENT') then do;\r\n    dcl int sender_found ;\r\n    dcl int sender_count;\r\n    dcl int value;\r\n    sender_found=0;  \r\n    /* Check if remitter already exists*/\r\n    do i = 1 to 10 ;\r\n        if profile.beneficiary.SENDER_ACC[i] = message.debitaccount.number then do; \r\n            profile.beneficiary.SENDER_DT[i] = message.payment.createdDt;  \r\n            sender_found = 1;\r\n            leave;\r\n        end;\r\n    end;\r\n /* If sender not found, shift existing data and add to position 1   */\r\n    if sender_found = 0 then do;\r\n    dcl int l;\r\n        do i = 10 to 2 by -1;  \r\n        l=i-1;\r\n            profile.beneficiary.SENDER_ACC[i] = profile.beneficiary.SENDER_ACC[l];  \r\n            profile.beneficiary.SENDER_DT[i] = profile.beneficiary.SENDER_DT[l];  \r\n        end; \r\n        profile.beneficiary.SENDER_ACC[1] = message.debitaccount.number;\r\n        profile.beneficiary.SENDER_DT[1] = message.payment.createdDt;\r\n   end;\r\n   \r\n    sender_count=0;\r\n    do i = 1 to 10;\r\n    if lists.bidv_threshold.lookup('R03_sender_window_hr') then do;\r\n        value = listValues.bidv_threshold.threshold;\r\n        if not missing(profile.beneficiary.SENDER_DT[i]) and message.payment.createdDt-profile.beneficiary.SENDER_DT[i] < dhms(0,value,0,0) then do;\r\n                sender_count=sender_count+1;\r\n        end;\r\n    end;\r\n    end;\r\n    if lists.bidv_threshold.lookup('R03_unique_sender_count') then do;\r\n        if sender_count>=listValues.bidv_threshold.threshold then do;\r\n                    \r\n                profile.beneficiary.mule_flag = 1;\r\n            \r\n        end;\r\n    end;\r\n\r\n    if missing(profile.customer_beneficiary.PREV_DEBIT_TXN_DT_HR[1]) then do;\r\n       profile.customer_beneficiary.PREV_DEBIT_TXN_DT_HR[1] = message.payment.createdDt; \r\n       profile.customer_beneficiary.PREV_DEBIT_TXN_AMT_HR[1] = message.payment.amount;\r\n    end;\r\n    else if message.payment.createdDt - profile.customer_beneficiary.PREV_DEBIT_TXN_DT_HR[1] < dhms(0,1,0,0) then do; \r\n        profile.customer_beneficiary.PREV_DEBIT_TXN_AMT_HR[1] = profile.customer_beneficiary.PREV_DEBIT_TXN_AMT_HR[1] + message.payment.amount;\r\n    end; \r\n    else do;\r\n        dcl int m;\r\n            do  i = 24 to 2 by -1;\r\n            m=i-1;\r\n                profile.customer_beneficiary.PREV_DEBIT_TXN_DT_HR[i] = profile.customer_beneficiary.PREV_DEBIT_TXN_DT_HR[m];\r\n                profile.customer_beneficiary.PREV_DEBIT_TXN_AMT_HR[i] = profile.customer_beneficiary.PREV_DEBIT_TXN_AMT_HR[m];\r\n            end;\r\n        /* Update the first record with the new transaction   */\r\n        profile.customer_beneficiary.PREV_DEBIT_TXN_DT_HR[1] = message.payment.createdDt;\r\n        profile.customer_beneficiary.PREV_DEBIT_TXN_AMT_HR[1] = message.payment.amount;\r\n    end;\r\nend;\r\n"
