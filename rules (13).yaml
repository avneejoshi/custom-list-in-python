    - authoringMethod: code
      baseRuleId: "51514"
      code: "if message.authentication.decision = 'FAILED' and message.payment.type in ('ECOM','MOBILE WALLETS') then do;\r\n    dcl int i;\r\n    do i = 10 to 2 by -1;\r\n        profile.creditcard.FAILED_ATTEMPTS_DT[i] = profile.creditcard.FAILED_ATTEMPTS_DT[i-1];\r\n    end;\r\n    profile.creditcard.FAILED_ATTEMPTS_DT[1] = message.payment.createdDt;\r\nend;\r\n\r\n/* --- Track last 10 amounts and datetimes --- */\r\nif  message.authentication.decision = 'SUCCESS' and message.payment.type in ('ECOM','MOBILE WALLETS') then do;\r\n    dcl int i;\r\n    do i = 10 to 2 by -1;\r\n        profile.creditcard.LAST_TRX_DT[i]  = profile.creditcard.LAST_TRX_DT[i-1];\r\n        profile.creditcard.LAST_TRX_AMT[i] = profile.creditcard.LAST_TRX_AMT[i-1];\r\n    end;\r\n    profile.creditcard.LAST_TRX_DT[1]  = message.payment.createdDt;\r\n    profile.creditcard.LAST_TRX_AMT[1] = message.payment.amount;\r\nend;"
