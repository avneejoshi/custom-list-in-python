    - authoringMethod: assistant
      baseRuleId: "51553"
      code: |+
        if (message.payment.type = 'POS') then do;
          if ('Currrent Transaction Time' IN ('01:00:00Z - 05:00:00Z') & message.merchant.categoryCode ~IN ('excludedmccList.mcc')) then do;
          if (message.payment.amount > index('acb_threshold.R02_POS_AMOUNT','threshold_value') & profile.merchant.total_tran_count > index('acb_threshold.R02_POS_COUNT','threshold_value')) then do;
          profile.customer.ACB_SCORE_2=index('acb_score.R02','score');
        detection.decline();detection.fire();
        end;

        end;

        end;

