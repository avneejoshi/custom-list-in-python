    - authoringMethod: code
      baseRuleId: "51522"
      code: "\r\nif message.payment.type = 'FUND TRANSFER' OR message.payment.type = 'BILL PAYMENT'  then do;\r\n    if not missing(message.device.macAddress) then do;\r\n        dcl int recent_account_count;\r\n        recent_account_count = 0;\r\n        do i = 1 to 5;\r\n            if lists.threshold.lookup('lookback_period_4') then do;\r\n                if not missing(profile.device.CUST_MAC_DT[i]) and (message.payment.createdDt - profile.device.CUST_MAC_DT[i] < dhms(0,listValues.threshold.threshold_value,0,0)) then do;\r\n                        recent_account_count = recent_account_count + 1;\r\n                end;\r\n            end;\r\n    end;\r\n        if lists.threshold.lookup('account_count_4') then do;\r\n            if recent_account_count > listValues.threshold.threshold_value then do;\r\n                if lists.score.lookup('RULE_4') then do;\r\n                        profile.customer.RULE_SCORE_4 = listValues.score.score_value;\r\n                        detection.Fire();\r\n                end;\r\n            end;\r\n        end;\r\n    end;\r\nend;\r\n\r\n\r\n   if message.payment.type = 'FUND TRANSFER' OR message.payment.type = 'BILL PAYMENT'  then do;\r\n    if not missing(message.device.udid) then do;\r\n        dcl int recent_account_count_2;\r\n        recent_account_count_2 = 0;\r\n        do i = 1 to 5;\r\n            if lists.threshold.lookup('lookback_period_4') then do;\r\n                if not missing(profile.deviceId.CUST_DEVID_DT[i]) and (message.payment.createdDt - profile.deviceId.CUST_DEVID_DT[i] < dhms(0,listValues.threshold.threshold_value,0,0)) then do;\r\n                        recent_account_count_2 = recent_account_count_2 + 1;\r\n                end;\r\n            end;\r\n    end;\r\n        if lists.threshold.lookup('account_count_4') then do;\r\n            if recent_account_count_2 > listValues.threshold.threshold_value then do;\r\n                if lists.score.lookup('RULE_4') then do;\r\n                        if profile.customer.RULE_SCORE_4= 0 then do; \r\n                        profile.customer.RULE_SCORE_4 = listValues.score.score_value;\r\n                        detection.Fire();\r\n                    end;\r\n                end;\r\n            end;\r\n        end;\r\n    end;\r\nend;\r\n"
      createdBy: sas
      creationTimeStamp: "2026-08-12T06:56:10.873811Z"
      description: A unique device identifier (MAC address) is used to make transactions for more than 01 payment account.
