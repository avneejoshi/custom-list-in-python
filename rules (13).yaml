    - authoringMethod: code
      baseRuleId: "51497"
      code: "if message.payment.type = 'FUND TRANSFER' then do;\r\n\r\n    dcl int is_new_device;\r\n    dcl int i;\r\n    dcl double beneficiary_window;\r\n\r\n    is_new_device = 1;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Check whether device is already known                */\r\n    /*------------------------------------------------------*/\r\n\r\n    if not missing(message.device.macAddress) then do;\r\n\r\n        do i = 1 to 10;\r\n\r\n            if not missing(profile.customer.LAST_UNIQUE_DEVICE_ID[i])\r\n               and profile.customer.LAST_UNIQUE_DEVICE_ID[i] =\r\n                   message.device.macAddress then do;\r\n\r\n                is_new_device = 0;\r\n                leave;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Beneficiary addition window                          */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R01_BENEFICIARY_WINDOW_MIN') then do;\r\n\r\n        beneficiary_window =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* New device/IP + recent beneficiary addition          */\r\n    /*------------------------------------------------------*/\r\n\r\n    if (is_new_device = 1)\r\n       and not missing(profile.customer_beneficiary.ADD_DT)\r\n       and message.payment.createdDt >=\r\n           profile.customer_beneficiary.ADD_DT\r\n        and message.device.countryCode ^= \r\n            message.device.ipCountryCode\r\n       and message.payment.createdDt -\r\n           profile.customer_beneficiary.ADD_DT <=\r\n           dhms(0,0,beneficiary_window,0) then do;\r\n\r\n\r\n        /*--------------------------------------------------*/\r\n        /* Get configured R01 score                         */\r\n        /*--------------------------------------------------*/\r\n\r\n        if lists.cimb_score.lookup('R01') then do;\r\n\r\n            profile.customer.Rule_score_1 =listValues.cimb_score.score;\r\n            profile.customer.fired_rule_desc='Detects account takeovers by flagging fund transfers to new beneficiaries shortly after login from unfamiliar devices using OTP authentication';\r\n            profile.customer.fired_rule_name ='CIMB R01 Account Takeover';\r\n            detection.Fire();\r\n\r\n        end;\r\n\r\n    end;\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-10-08T09:47:11.506591Z"
      description: Detects account takeovers by flagging fund transfers to new beneficiaries shortly after login from unfamiliar devices using OTP authentication
