    - alertReason: All three conditions met.
      alertType: sfd_customer
      authoringMethod: code
      baseRuleId: "51526"
      code: "if  message.payment.type in ('LOGIN', 'FUND TRANSFER') then do;\r\n\r\nif (profile.customer.RULE_SCORE_2 = 600 ) then do; \r\n  detection.Alert();\r\n  detection.Decline();\r\n  profile.customer.Alertoutput='Decline';\r\nend;\r\nelse do;\r\n  detection.Approve();\r\n  profile.customer.Alertoutput='Approve';\r\nend;\r\nend;"
