    - authoringMethod: code
      baseRuleId: "51501"
      code: "\r\ndcl int a;\r\ndcl int b;\r\ndcl int c;\r\ndcl int final;\r\n\r\na = 0;\r\nb = 0;\r\nc = 0;\r\nfinal = 0;\r\n\r\n/*Check for CREDIT*/\r\nif message.payment.type in ('ATM WITHDRAWAL', 'BILL PAYMENT', 'FUND TRANSFER') then do;\r\n    dcl int sender_count;\r\n    sender_count=0;\r\n    do i = 1 to 10;\r\n        if lists.threshold.lookup('lookback_period_2') then do;\r\n            if not missing(profile.account.SENDER_DT[i]) and message.payment.createdDt-profile.account.SENDER_DT[i] < dhms(0,0,listValues.threshold.threshold_value,0) then do;\r\n                sender_count=sender_count+1;\r\n            end;\r\n        end;\r\n    end;\r\n    if lists.threshold.lookup('unique_sender_2') then do;\r\n        if sender_count>=listValues.threshold.threshold_value then do;\r\n            if lists.score.lookup('Rule_2A') then do;        \r\n                profile.customer.RULE_SCORE_2A = 100;\r\n            end;\r\n        end;\r\n    end;\r\nend;\r\n\r\n/*Check for 2nd condition*/\r\nif message.payment.type in ('ATM WITHDRAWAL', 'BILL PAYMENT', 'FUND TRANSFER') then do;\r\n    dcl int credit_amt;\r\n    dcl int debit_amt;\r\n    dcl int i;\r\n    dcl int value;\r\n    credit_amt = 0;\r\n    debit_amt = 0;\r\n    if lists.threshold.lookup('lookback_period_2') then do;\r\n        value = listValues.threshold.threshold_value;\r\n        do i = 1 to value;\r\n            if not missing(profile.account.PREV_CREDIT_TXN_DT_MIN[i]) and\r\n               message.payment.createdDt - profile.account.PREV_CREDIT_TXN_DT_MIN[i] < dhms(0,0,value,0) then do;\r\n                credit_amt = credit_amt + profile.account.PREV_CREDIT_TXN_AMT_MIN[i];\r\n            end;\r\n            if not missing(profile.account.PREV_DEBIT_TXN_DT_MIN[i]) and\r\n               message.payment.createdDt - profile.account.PREV_DEBIT_TXN_DT_MIN[i] < dhms(0,0,value,0) then do;\r\n                debit_amt = debit_amt + profile.account.PREV_DEBIT_TXN_AMT_MIN[i];\r\n            end;\r\n        end;\r\n    end;\r\n\r\n    if lists.threshold.lookup('percent_2') then do;\r\n        if credit_amt > 0 and debit_amt >= (listValues.threshold.threshold_value / 100) * credit_amt then do;\r\n            if lists.score.lookup('Rule_2B') then do;\r\n                profile.customer.RULE_SCORE_2B = 200;\r\n            end;\r\n        end;\r\n    end;\r\nend;\r\n\r\n/*Check for Low account balance*/\r\nif message.payment.type in ('ATM WITHDRAWAL', 'BILL PAYMENT', 'FUND TRANSFER') then do;\r\n    if lists.threshold.lookup('balance_2') then do;\r\n        if message.debitaccount.availableBalance <= listValues.threshold.threshold_value then do;\r\n            if lists.score.lookup('Rule_2C') then do;\r\n                profile.customer.RULE_SCORE_2C = 300;\r\n            end;\r\n        end;\r\n    end;\r\nend;\r\n\r\n/* Check if all three conditions are met */\r\nif lists.score.lookup('Rule_2A') then do;\r\n    a = 100;\r\nend;\r\n\r\nif lists.score.lookup('Rule_2B') then do;\r\n    b = 200;\r\nend;\r\n\r\nif lists.score.lookup('Rule_2C') then do;\r\n    c = 300;\r\nend;\r\n\r\nfinal = a + b + c;\r\n\r\nif profile.customer.RULE_SCORE_2A = 100 and\r\n   profile.customer.RULE_SCORE_2B = 200 and\r\n   profile.customer.RULE_SCORE_2C = 300 then do;\r\n\r\n    profile.customer.RULE_SCORE_2 = 600;\r\n    profile.customer.fired_rule_name = 'ACB R3 Mule Activity';\r\n    profile.customer.fired_rule_desc = 'Flags accounts receiving funds from multiple sources and rapidly withdrawing, indicating mule activity.';\r\n    detection.Fire();\r\nend;\r\n\r\n\r\n"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:06:37.676516Z"
