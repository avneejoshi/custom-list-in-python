    - authoringMethod: code
      baseRuleId: "51507"
      code: "/*---------------------------10 recent senders datetime and account number------------------------------------------*/\r\n if message.payment.type = 'CREDIT' then do;\r\n    dcl int sender_found ;\r\n    sender_found=0;  \r\n    do i = 1 to 10 ;\r\n        if profile.account.SENDER_ACC[i] = message.creditaccount.number then do; \r\n            profile.account.SENDER_DT[i] = message.payment.createdDt;  \r\n            sender_found = 1;\r\n            leave;\r\n        end;\r\n    end;  \r\n /* If sender not found, shift existing data and add to position 1   */\r\n    if sender_found = 0 then do;\r\n    dcl int l;\r\n        do i = 10 to 2 by -1;  \r\n        l=i-1;\r\n            profile.account.SENDER_ACC[i] = profile.account.SENDER_ACC[l];  \r\n            profile.account.SENDER_DT[i] = profile.account.SENDER_DT[l];  \r\n        end; \r\n        profile.account.SENDER_ACC[1] = message.creditaccount.number;\r\n        profile.account.SENDER_DT[1] = message.payment.createdDt;\r\n   end; \r\nend;  \r\n\r\n/*credit*/\r\nif message.payment.type = 'CREDIT' then do;  \r\nif  missing(profile.account.PREV_CREDIT_TXN_DT_MIN[1]) then do;\r\n     profile.account.PREV_CREDIT_TXN_DT_MIN[1] = message.payment.createdDt;  \r\n           profile.account.PREV_CREDIT_TXN_AMT_MIN[1] = message.payment.amount;  \r\n    end;\r\n    else if message.payment.createdDt - profile.account.PREV_CREDIT_TXN_DT_MIN[1] < dhms(0,0,1,0) then do;  \r\n        profile.account.PREV_CREDIT_TXN_AMT_MIN[1] = profile.account.PREV_CREDIT_TXN_AMT_MIN[1] + message.payment.amount; \r\n        end;   \r\n    else do; \r\n        do i = 60 to 2 by -1;\r\n        dcl int k;\r\n        k=i-1;\r\n            profile.account.PREV_CREDIT_TXN_DT_MIN[i] =profile.account.PREV_CREDIT_TXN_DT_MIN[k];  \r\n            profile.account.PREV_CREDIT_TXN_AMT_MIN[i] =profile.account.PREV_CREDIT_TXN_AMT_MIN[k];\r\n        end;\r\n        profile.account.PREV_CREDIT_TXN_DT_MIN[i] = message.payment.createdDt;  \r\n       profile.account.PREV_CREDIT_TXN_AMT_MIN[i] = message.payment.amount;  \r\n    end;  \r\nend; \r\n\r\n/*debit*/\r\nif message.payment.type = 'FUND TRANSFER' or message.payment.type = 'BILL PAYMENT' or message.payment.type = 'ATM WITHDRAWAL'  then do;\r\n    if missing(profile.account.PREV_DEBIT_TXN_DT_MIN[1]) then do;\r\n       profile.account.PREV_DEBIT_TXN_DT_MIN[1] = message.payment.createdDt; \r\n       profile.account.PREV_DEBIT_TXN_AMT_MIN[1] = message.payment.amount;\r\n    end;\r\n   else if message.payment.createdDt - profile.account.PREV_DEBIT_TXN_DT_MIN[1] < dhms(0,0,1,0) then do; \r\n        profile.account.PREV_DEBIT_TXN_AMT_MIN[1] = profile.account.PREV_DEBIT_TXN_AMT_MIN[1] + message.payment.amount;\r\n    end; \r\nelse do;\r\n        dcl int m;\r\n            do  i = 60 to 2 by -1;\r\n            m=i-1;\r\n                profile.account.PREV_DEBIT_TXN_DT_MIN[i] = profile.account.PREV_DEBIT_TXN_DT_MIN[m];\r\n                profile.account.PREV_DEBIT_TXN_AMT_MIN[i] = profile.account.PREV_DEBIT_TXN_AMT_MIN[m];\r\n            end;\r\n        /* Update the first record with the new transaction   */\r\n        profile.account.PREV_DEBIT_TXN_DT_MIN[1] = message.payment.createdDt;\r\n        profile.account.PREV_DEBIT_TXN_AMT_MIN[1] = message.payment.amount;\r\n    end;\r\nend;\r\n\r\n"
      createdBy: sas
      creationTimeStamp: "2026-08-12T06:56:10.78326Z"
