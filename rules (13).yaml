    - authoringMethod: code
      baseRuleId: "51535"
      code: "/*-----------------------------------------*/\r\n/* ACB P01 Merchant Card Testing            */\r\n/*-----------------------------------------*/\r\n\r\nif message.payment.type = 'ECOM'\r\n   and message.creditcard.whichCard = 'N'\r\n   and message.authentication.level = 'N'\r\n   and (message.authentication.onlinePaymentCryptogram = 'MISSING'\r\n        or message.authentication.onlinePaymentCryptogram = 'NOT PROVIDED') then do;\r\n\r\n    dcl int found;\r\n    dcl int j;\r\n\r\n    found = 0;\r\n\r\n    /* Check if card already exists */\r\n    do i=1 to 20;\r\n        if not missing(profile.merchant.PAN[i]) then do;\r\n            if profile.merchant.PAN[i] = message.creditcard.number then do;\r\n                profile.merchant.PAN_DT[i] = message.payment.createdDt;\r\n                found = 1;\r\n                leave;\r\n            end;\r\n        end;\r\n    end;\r\n\r\n    /* Add new card */\r\n    if found = 0 then do;\r\n\r\n        do j=20 to 2 by -1;\r\n            profile.merchant.PAN[j] =\r\n                profile.merchant.PAN[j-1];\r\n\r\n            profile.merchant.PAN_DT[j] =\r\n                profile.merchant.PAN_DT[j-1];\r\n        end;\r\n\r\n        profile.merchant.PAN[1] =\r\n            message.creditcard.number;\r\n\r\n        profile.merchant.PAN_DT[1] =\r\n            message.payment.createdDt;\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:04:50.433935Z"
