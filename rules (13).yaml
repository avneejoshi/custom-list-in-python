    - authoringMethod: code
      baseRuleId: "51543"
      code: "if message.payment.type = 'FUND TRANSFER' then do;\r\n\r\n    /*--------------------------------------------\r\n      1. Check Blacklisted Beneficiary Account\r\n    --------------------------------------------*/\r\n\r\n    if lists.blacklistedBeneficiaryAccount.lookup(\r\n        message.creditaccount.iban) then do;\r\n\r\n        /* HIGH */\r\n        if listValues.blacklistedBeneficiaryAccount.risk_level =\r\n           'HIGH' then do;\r\n\r\n            if lists.acb_score.lookup('R04_HIGH') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc='Detects fund transfers to beneficiary accounts listed on the configured blacklist or watch list.';\r\n                profile.customer.fired_rule_name='ACB R4 Blacklisted Beneficiary Account';\r\n\r\n                profile.customer.ACB_SCORE_4 =\r\n                    listValues.acb_score.score;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n        /* MEDIUM */\r\n        else if listValues.blacklistedBeneficiaryAccount.risk_level =\r\n                'MEDIUM' then do;\r\n\r\n            if lists.acb_score.lookup('R04_MEDIUM') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc='Detects fund transfers to beneficiary accounts listed on the configured blacklist or watch list.';\r\n                profile.customer.fired_rule_name='ACB R4 Blacklisted Beneficiary Account';\r\n\r\n                profile.customer.ACB_SCORE_4 =\r\n                    listValues.acb_score.score;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n        /* LOW */\r\n        else if listValues.blacklistedBeneficiaryAccount.risk_level =\r\n                'LOW' then do;\r\n\r\n            if lists.acb_score.lookup('R04_LOW') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc='Detects fund transfers to beneficiary accounts listed on the configured blacklist or watch list.';\r\n                profile.customer.fired_rule_name='ACB R4 Blacklisted Beneficiary Account';\r\n\r\n                profile.customer.ACB_SCORE_4 =\r\n                    listValues.acb_score.score;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n\r\n    /*--------------------------------------------\r\n      2. Check Blacklisted Beneficiary Name\r\n    --------------------------------------------*/\r\n\r\n    if lists.blacklistedBeneficiaryName.lookup(\r\n        message.creditaccount.desc) then do;\r\n\r\n        /* HIGH */\r\n        if listValues.blacklistedBeneficiaryName.risk_level =\r\n           'HIGH' then do;\r\n\r\n            if lists.acb_score.lookup('R04_HIGH') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc='Detects fund transfers to beneficiary accounts listed on the configured blacklist or watch list.';\r\n                profile.customer.fired_rule_name='ACB R4 Blacklisted Beneficiary Account';\r\n\r\n                profile.customer.ACB_SCORE_4 =\r\n                    listValues.acb_score.score;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n        /* MEDIUM */\r\n        else if listValues.blacklistedBeneficiaryName.risk_level =\r\n                'MEDIUM' then do;\r\n\r\n            if lists.acb_score.lookup('R04_MEDIUM') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc='Detects fund transfers to beneficiary accounts listed on the configured blacklist or watch list.';\r\n                profile.customer.fired_rule_name='ACB R4 Blacklisted Beneficiary Account';\r\n\r\n                profile.customer.ACB_SCORE_4 =\r\n                    listValues.acb_score.score;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n        /* LOW */\r\n        else if listValues.blacklistedBeneficiaryName.risk_level =\r\n                'LOW' then do;\r\n\r\n            if lists.acb_score.lookup('R04_LOW') then do;\r\n\r\n                detection.Fire();\r\n                profile.customer.fired_rule_desc='Detects fund transfers to beneficiary accounts listed on the configured blacklist or watch list.';\r\n                profile.customer.fired_rule_name='ACB R4 Blacklisted Beneficiary Account';\r\n\r\n                profile.customer.ACB_SCORE_4 =\r\n                    listValues.acb_score.score;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;\r\n"
      createdBy: sas
