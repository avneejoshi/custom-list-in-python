    - alertReason: Same device used by multiple accounts
      alertType: sfd_device
      authoringMethod: code
      baseRuleId: "51564"
      code: "if message.payment.type in\r\n   ('FUND TRANSFER','BILL PAYMENT') then do;\r\n\r\n    dcl int account_count;\r\n    dcl int account_threshold;\r\n    dcl double lookback_days;\r\n    dcl int i;\r\n\r\n    account_count = 0;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Account count threshold                              */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R04_ACCOUNT_COUNT') then do;\r\n\r\n        account_threshold =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Device lookback                                      */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R04_LOOKBACK_DAYS') then do;\r\n\r\n        lookback_days =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Check accounts associated with device                */\r\n    /*------------------------------------------------------*/\r\n\r\n    if not missing(message.device.macAddress) then do;\r\n\r\n        do i = 1 to 5;\r\n\r\n            if not missing(profile.deviceId.ACCT_MAC[i])\r\n               and not missing(profile.deviceId.ACCT_MAC_DT[i])\r\n               and message.payment.createdDt >=\r\n                   profile.deviceId.ACCT_MAC_DT[i]\r\n               and message.payment.createdDt -\r\n                   profile.deviceId.ACCT_MAC_DT[i] <=\r\n                   dhms(lookback_days,0,0,0) then do;\r\n\r\n                account_count = account_count + 1;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Final condition                                      */\r\n    /*------------------------------------------------------*/\r\n\r\n    if account_count > account_threshold then do;\r\n\r\n        if lists.cimb_score.lookup('R04') then do;\r\n\r\n            profile.customer.Rule_score_4 =\r\n                listValues.cimb_score.score;\r\n\r\n            profile.customer.fired_rule_name =\r\n                'CIMB R04 Same Device Multiple Accounts';\r\n            profile.customer.fired_rule_desc='Detect potentially unauthorized access by identifying a customer accessing the account from a device not previously associated with their account.';\r\n\r\n            detection.Fire();\r\n            detection.Alert();\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-10-08T09:47:58.802523Z"
      description: Detect potentially unauthorized access by identifying a customer accessing the account from a device not previously associated with their account.
