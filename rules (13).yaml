    - authoringMethod: code
      baseRuleId: "51562"
      code: "if message.payment.type = 'LOGIN' \r\n   and message.payment.status = 'SUCCESS' then do;\r\n\r\n    dcl int failed_count;\r\n    dcl double latest_failed_dt;\r\n    dcl double failed_window;\r\n    dcl double success_window;\r\n    dcl int failed_threshold;\r\n    dcl int i;\r\n\r\n    failed_count = 0;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Failed login count threshold                         */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R02_FAILED_LOGIN_COUNT') then do;\r\n\r\n        failed_threshold =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Failed login lookback                                */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R02_FAILED_LOGIN_WINDOW_MIN') then do;\r\n\r\n        failed_window =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Successful login window                              */\r\n    /*------------------------------------------------------*/\r\n\r\n    if lists.cimb_threshold.lookup(\r\n           'R02_SUCCESS_WINDOW_MIN') then do;\r\n\r\n        success_window =\r\n            listValues.cimb_threshold.threshold_value;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Count failed logins                                  */\r\n    /*------------------------------------------------------*/\r\n\r\n    do i = 1 to 10;\r\n\r\n        if not missing(profile.customer.LOGIN_FAILED_DT[i])\r\n           and message.payment.createdDt >=\r\n               profile.customer.LOGIN_FAILED_DT[i]\r\n           and message.payment.createdDt -\r\n               profile.customer.LOGIN_FAILED_DT[i] <=\r\n               dhms(0,0,failed_window,0) then do;\r\n\r\n            failed_count = failed_count + 1;\r\n\r\n\r\n            /* Capture latest failed login */\r\n\r\n            if missing(latest_failed_dt)\r\n               or profile.customer.LOGIN_FAILED_DT[i] >\r\n                  latest_failed_dt then do;\r\n\r\n                latest_failed_dt =\r\n                    profile.customer.LOGIN_FAILED_DT[i];\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n\r\n    /*------------------------------------------------------*/\r\n    /* Final conditions                                     */\r\n    /*------------------------------------------------------*/\r\n\r\n    if failed_count >= failed_threshold\r\n       and not missing(latest_failed_dt)\r\n       and message.payment.createdDt >= latest_failed_dt\r\n       and message.payment.createdDt -\r\n           latest_failed_dt <=\r\n           dhms(0,0,success_window,0) then do;\r\n\r\n\r\n        if lists.cimb_score.lookup('R02') then do;\r\n\r\n            profile.customer.Rule_score_2 =\r\n                listValues.cimb_score.score;\r\n            profile.customer.fired_rule_name='CIMB R02 Suspicious Login';\r\n            profile.customer.fired_rule_desc='Detect potential credential compromise, credential stuffing or unauthorized access by identifying repeated failed login attempts followed by a successful login.';\r\n\r\n            detection.Fire();\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;\r\n\r\n"
      createdBy: sas
