    - alertType: sfd_customer
      authoringMethod: code
      baseRuleId: "51534"
      code: "if  message.payment.type = 'FUND TRANSFER' or message.payment.type = 'CREDIT' then do;\r\nprofile.customer.AGG_Rule_Score = profile.customer.RULE_SCORE_2+profile.customer.RULE_SCORE_3 + profile.customer.RULE_SCORE_7 ;\r\nif ( profile.customer.AGG_Rule_Score > 0 ) then do; \r\n  detection.Alert();\r\n  detection.Decline();\r\n  profile.customer.Alertoutput='Decline';\r\nend;\r\nelse do;\r\n  detection.Approve();\r\n  profile.customer.Alertoutput='Approve';\r\nend;\r\nend;\r\n\r\n\r\n"
