    - authoringMethod: code
      baseRuleId: "51519"
      code: "\r\n\r\nif message.payment.type = 'CREDIT' then do;\r\n    if lists.threshold.lookup('account_count_1') then do;\r\n    if profile.account.blacklist_credit_count > listValues.threshold.threshold_value then do;\r\n        if lists.score.lookup('RULE_1') then do;\r\n            profile.customer.RULE_SCORE_1 = listValues.score.score_value;\r\n            profile.customer.BLOCK_CODE = 'ABLK';\r\n            detection.Fire();\r\n        end;\r\n        end;\r\n    end;\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-08-12T06:56:10.858051Z"
