      code: "if message.payment.type = 'POS' then do;\r\n\r\n    dcl double txn_time;\r\n    dcl double pos_txn_count;\r\n    dcl double pos_txn_amount;\r\n\r\n    txn_time = timepart(message.payment.createdDt);\r\n\r\n    pos_txn_count  = 0;\r\n    pos_txn_amount = 0;\r\n\r\n    if txn_time >= hms(1,0,0)\r\n       and txn_time <= hms(5,0,0) then do;\r\n\r\n        if not lists.excludedmccList.contains(\r\n            message.merchant.productSKU) then do;\r\n\r\n            if lists.acb_threshold.lookup('R02_CURRENT_AMOUNT') then do;\r\n\r\n                if message.payment.amount >\r\n                   listValues.acb_threshold.threshold_value then do;\r\n\r\n                    do i = 1 to 24;\r\n\r\n                        if not missing(\r\n                            profile.creditcard.POS_TXN_DT_HR[i]) then do;\r\n\r\n                            if timepart(\r\n                                profile.creditcard.POS_TXN_DT_HR[i])\r\n                                >= hms(1,0,0)\r\n\r\n                               and timepart(\r\n                                profile.creditcard.POS_TXN_DT_HR[i])\r\n                                <= hms(5,0,0) then do;\r\n\r\n                                if not missing(\r\n                                    profile.creditcard.POS_TXN_CNT_HR[i]) then\r\n                                    pos_txn_count =\r\n                                        pos_txn_count +\r\n                                        profile.creditcard.POS_TXN_CNT_HR[i];\r\n\r\n                                if not missing(\r\n                                    profile.creditcard.POS_TXN_AMT_HR[i]) then\r\n                                    pos_txn_amount =\r\n                                        pos_txn_amount +\r\n                                        profile.creditcard.POS_TXN_AMT_HR[i];\r\n\r\n                            end;\r\n\r\n                        end;\r\n\r\n                    end;\r\n\r\n                    if lists.acb_threshold.lookup('R02_POS_COUNT') then do;\r\n\r\n                        if pos_txn_count >\r\n                           listValues.acb_threshold.threshold_value then do;\r\n\r\n                            if lists.acb_threshold.lookup('R02_POS_AMOUNT') then do;\r\n\r\n                                if pos_txn_amount >\r\n                                   listValues.acb_threshold.threshold_value then do;\r\n\r\n                                    if lists.acb_score.lookup('R02') then do;\r\n\r\n                                        detection.Fire();\r\n                                        profile.customer.fired_rule_desc='Detects unusually high POS transaction frequency and total spending during late-night hours.';\r\n                                        profile.customer.fired_rule_name='ACB R2 POS Velocity Spike';\r\n\r\n                                        profile.customer.ACB_SCORE_2 =\r\n                                            listValues.acb_score.score;\r\n\r\n                                    end;\r\n\r\n                                end;\r\n\r\n                            end;\r\n\r\n                        end;\r\n\r\n                    end;\r\n\r\n                end;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;\r\n"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:06:19.242398Z"
