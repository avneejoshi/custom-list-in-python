    - authoringMethod: code
      baseRuleId: "51542"
      code: "if message.payment.type = 'CUST DETAIL CHANGE'\r\n   and (message.payment.subType = 'PHONE CHANGE'\r\n        or message.payment.subType = 'EMAIL CHANGE') then do;\r\n\r\n    dcl int update_count;\r\n\r\n    update_count = 0;\r\n\r\n    do i = 1 to 5;\r\n\r\n        if not missing(profile.customer.PH_EM_UPDT_DT[i])\r\n           and message.payment.createdDt -\r\n               profile.customer.PH_EM_UPDT_DT[i]\r\n               <= dhms(30,0,0,0) then do;\r\n\r\n            update_count = update_count + 1;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\n    if lists.acb_threshold.lookup('R03_UPDATE_COUNT') then do;\r\n\r\n        if update_count >=\r\n           listValues.acb_threshold.threshold_value then do;\r\n\r\n            if lists.acb_score.lookup('R03') then do;\r\n\r\n                detection.Fire();\r\n\r\n                profile.customer.ACB_SCORE_3 =\r\n                    listValues.acb_score.score;\r\n\r\n            end;\r\n\r\n        end;\r\n\r\n    end;\r\n\r\nend;"
      createdBy: sas
      creationTimeStamp: "2026-09-21T11:08:26.206104Z"
