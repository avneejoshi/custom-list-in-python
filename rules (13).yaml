    - authoringMethod: assistant
      baseRuleId: "51552"
      code: |+
        if (message.payment.type = 'ECOM') then do;
          if ('Card Present Indicator' = 'N' & 'threeDS Indicator' = 'N' & 'cvv2 Result' IN ('MISSING','NOT PROVIDED')) then do;
          if (sum(profile.merchant.total_tran_count,5) > index('acb_threshold.R01_DISTINCT_PAN ','threshold_value')) then do;
          profile.customer.ACB_SCORE_1=index('acb_score.R01','score');
        detection.decline();detection.fire();
        end;

        end;

        end;

      createdBy: sas
      creationTimeStamp: "2026-08-19T10:01:21.927096Z"
