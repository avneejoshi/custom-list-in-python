    - authoringMethod: code
      baseRuleId: "51524"
      code: "\r\nif message.payment.type = 'CUST DETAIL CHANGE' and message.customer.type='B' then do;\r\n        dcl int update_count_2;\r\n        update_count_2 = 0;\r\n        do i = 1 to 5;\r\n            if lists.threshold.lookup('lookback_period_6') then do;\r\n                if not missing(profile.customer.PH_EM_UPDT_DT[i]) and message.payment.createdDt - profile.customer.PH_EM_UPDT_DT[i] <= dhms(listValues.threshold.threshold_value,0,0,0) then do;\r\n                    update_count_2 = update_count_2 + 1;\r\n                end;\r\n            end;\r\n        end;\r\n        if lists.threshold.lookup('update_count_corp_6') then do;\r\n            if update_count_2 >= listValues.threshold.threshold_value then do;\r\n                if lists.score.lookup('RULE_6') then do;\r\n                    profile.customer.RULE_SCORE_6 = listValues.score.score_value;\r\n                    detection.Fire();\r\n                end;\r\n            end;    \r\n        end;\r\nend;\r\nelse if message.payment.type = 'CUST DETAIL CHANGE' and (message.customer.type='I'or missing(message.customer.type) ) then do;\r\n        dcl int update_count;\r\n        update_count = 0;\r\n        do i = 1 to 5;\r\n            if lists.threshold.lookup('lookback_period_6') then do;\r\n                if not missing(profile.customer.PH_EM_UPDT_DT[i]) and message.payment.createdDt - profile.customer.PH_EM_UPDT_DT[i] <= dhms(listValues.threshold.threshold_value,0,0,0) then do;\r\n                    update_count = update_count + 1;\r\n                end;\r\n            end;\r\n        end;\r\n        if lists.threshold.lookup('update_count_6') then do;\r\n            if update_count >= listValues.threshold.threshold_value then do;\r\n                if lists.score.lookup('RULE_6') then do;\r\n                    profile.customer.RULE_SCORE_6 = listValues.score.score_value;\r\n                    detection.Fire();\r\n                end;\r\n            end;    \r\n        end;\r\nend;\r\n\r\n\r\n"
      createdBy: sas
