    - authoringMethod: assistant
      baseRuleId: "51558"
      code: |+
        if (message.payment.type IN ('ATM WITHDRAWAL','BILL PAYMENT','FUND TRANSFER')) then do;
          if (profile.customer.cnt_unique_sender_acc_lookback_period = index('threshold.unique_sender_2','threshold_value')) then do;
          profile.customer.RULE_SCORE_2A=index('score.Rule_2A','score_value');

        end;
        if (profile.customer.total_credit_debit_amt_ratio = index('threshold.debt_credit_ration','threshold_value')) then do;
          profile.customer.RULE_SCORE_2B=index('score.Rule_2B','score_value');

        end;
        if (message.debitaccount.availableBalance < index('threshold.balance_2','threshold_value')) then do;
          profile.customer.RULE_SCORE_2C=index('score.Rule_2C','score_value');

        end;
        if (~MISSING(profile.customer.RULE_SCORE_2A) & ~MISSING(profile.customer.RULE_SCORE_2B) & ~MISSING(profile.customer.RULE_SCORE_2C)) then do;
          profile.customer.RULE_SCORE_2=sum((profile.customer.RULE_SCORE_2A + profile.customer.RULE_SCORE_2B),(profile.customer.RULE_SCORE_2C + 0));
        detection.decline();detection.fire();
        end;

        end;

