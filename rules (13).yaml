    - alertType: sfd_customer
      authoringMethod: code
      baseRuleId: "51532"
      code: "if  message.payment.type in ('CREDIT','FUND TRANSFER','BILL PAYMENT','LOGIN','BENEFICIARY ADDITION') then do;\r\n  profile.customer.AGG_Rule_Score = profile.customer.RULE_SCORE_1 + profile.customer.RULE_SCORE_2 + \r\n      profile.customer.RULE_SCORE_3 ;\r\n    \r\n    if profile.customer.AGG_Rule_Score < 40 then do;\r\n      detection.Approve();\r\n      profile.customer.Alertoutput='Approve';\r\n    end;\r\n    else if (profile.customer.AGG_Rule_Score >= 40 & profile.customer.AGG_Rule_Score < 80)  then do; \r\n      detection.Alert();\r\n      profile.customer.Alertoutput='Alert the customer';\r\n    end;\r\n  else if ( profile.customer.AGG_Rule_Score >= 80 & profile.customer.AGG_Rule_Score < 90 ) then do; \r\n    detection.Alert();\r\n    profile.customer.Alertoutput='Route to Anti-Fraud Unit';\r\n    end;\r\n   \r\n  else do;\r\n    detection.Decline();\r\n    detection.Alert();\r\n    profile.customer.Alertoutput='Decline';\r\n  end;\r\nend;"
