    - authoringMethod: code
      baseRuleId: "51509"
      code: "if message.payment.type='POS' or message.payment.type='ECOM' or \r\nmessage.payment.type='MOBILE WALLETS' or message.payment.type='ATM WITHDRAWAL' then do;\r\n    if missing(profile.creditcard.ALL_TRX_DT_MIN[1]) then do;\r\n        profile.creditcard.ALL_TRX_DT_MIN[1]=message.payment.createdDt;\r\n        profile.creditcard.ALL_TRX_AMT_MIN[1]=message.payment.amount;\r\n        profile.creditcard.ALL_TRX_COUNT_MIN[1]=1;\r\n    end;\r\n    else if message.payment.createdDt-profile.creditcard.ALL_TRX_DT_MIN[1] < dhms(0,0,1,0) then do;\r\n            profile.creditcard.ALL_TRX_AMT_MIN[1]=profile.creditcard.ALL_TRX_AMT_MIN[1]+message.payment.amount;\r\n            profile.creditcard.ALL_TRX_COUNT_MIN[1]=profile.creditcard.ALL_TRX_COUNT_MIN[1]+1;\r\n    end;\r\n    else do;\r\n        dcl int o;\r\n        do i = 60 to 2 by -1;\r\n            o=i-1;\r\n            profile.creditcard.ALL_TRX_DT_MIN[i]=profile.creditcard.ALL_TRX_DT_MIN[o];\r\n          profile.creditcard.ALL_TRX_AMT_MIN[i]=profile.creditcard.ALL_TRX_AMT_MIN[o];\r\n            profile.creditcard.ALL_TRX_COUNT_MIN[i]=profile.creditcard.ALL_TRX_COUNT_MIN[o];\r\n        end;\r\n        profile.creditcard.ALL_TRX_DT_MIN[1]=message.payment.createdDt;\r\n        profile.creditcard.ALL_TRX_AMT_MIN[1]=message.payment.amount;\r\n        profile.creditcard.ALL_TRX_COUNT_MIN[1]=1;\r\n    end;\r\nend;\r\n"
