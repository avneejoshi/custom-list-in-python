    - authoringMethod: assistant
      baseRuleId: "51570"
      code: |+
        if (message.payment.type = '"FUND TRANSFER"') then do;
          if (message.device.macAddress ~IN ('customer.LAST_UNIQUE_DEVICE_ID')) then do;
          if ('payment.createdDt - customer_beneficiary.ADD_DT' IN ('index(cimb_threshold.R01_BENEFICIARY_WINDOW_MIN)')) then do;
          if (message.device.countryCode ~= message.device.ipCountryCode) then do;
          profile.customer.RULE_SCORE_1=index('cimb_score.R01','score');

        end;

        end;

        end;
        if (profile.customer.RULE_SCORE_1 > 0) then do;
          detection.decline();detection.fire();
        end;

        end;

      createdBy: sas
      creationTimeStamp: "2026-09-23T07:09:07.23155Z"
